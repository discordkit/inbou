name: Release

on:
  push:
    branches: [main]

# Serialize releases on a ref without cancelling: a cancelled run could leave
# one Worker deployed and the other not.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUMPY: "@varlock/bumpy@1.18.1"

jobs:
  # What would a release do right now? Read-only, no credentials — the answer
  # decides which of the two jobs below runs, and only ever one of them.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - id: plan
        run: yarn dlx $BUMPY ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  # Opens or updates the version PR: the changelog and version bump, for review
  # before anything ships. Carries no deploy credentials.
  version-pr:
    name: Version PR
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: yarn dlx $BUMPY ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          # A PR opened with the default token does not trigger workflows —
          # GitHub's anti-recursion guard. Since `main` requires the
          # `Check & Test` check to merge, a version PR created without this
          # token could never satisfy its own ruleset.
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # The version PR merged. Tag, release, and deploy.
  release:
    name: Release & Deploy
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Records a GitHub Deployment, so the repo's Environments panel shows what
    # is live and when it shipped. Also the place to attach protection rules
    # and to scope these secrets to, rather than leaving them repo-wide.
    environment:
      name: production
      url: https://inbou.saeris.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"
          cache: true

      # The same gate as CI, re-run against the merge commit. CI passed on the
      # version PR, but this is the commit that actually ships.
      - run: vp check
      - run: vp test
      - run: vp run check:bundle

      # `bumpy publish` runs `vp run deploy` for this package — see
      # `.bumpy/_config.json`. That script builds with Vite, migrates D1, and
      # deploys handlers before bot, which the service binding requires.
      - run: yarn dlx $BUMPY ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          # So the `release: published` event can trigger other workflows.
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # For `commands:register`, which calls Discord's REST API from this
          # runner. NOT what the deployed Workers read — they take their own
          # copies from Cloudflare Worker secrets, set once and persisting
          # across deploys. Setting them here would not reach the Workers.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
