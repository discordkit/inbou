# 問題6 情報検索 — information to search, shown as a picture, and a question that needs it.
#
# The picture holds only the information: never the options. Its `material` is structured, and a template draws it, so an edit here is a reviewable diff. Blocks are `text` (lines), `table` (a head and rows of the same width; a month calendar is a seven-column table), `lists` (side-by-side lists of name and value pairs, such as a menu) and `panels` (boxes two to a row, each a heading over a few lines, such as the routes on a route chart).
#
# The picture must hold everything a question needs. A rubbish calendar marks days with symbols, so it carries the legend that says which rubbish each symbol is: no answer may rest on knowing how a town sorts its rubbish.
#
# Keep it small. The picture must read at chat size, about 300 px wide on a phone: about eight rows of about twenty characters. A real 問題6 page holds more; ours are simpler versions of the same kinds of page.
#
# One picture serves several questions, and a test asks one. Questions combine conditions, as the paper's do: a budget, then the cheapest; a time, then the latest bus. Same rules as 問題4 otherwise (see short.yaml).

