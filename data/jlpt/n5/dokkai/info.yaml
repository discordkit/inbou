          - "すみません。よろしく おねがいします。"
    foot: ["パン{屋|や} こむぎ"]
  en: "A handwritten sign on a shop door. Thank you as always. We are closed from Tuesday 14 July to Friday 17 July. On Saturday the 18th we open at 1 p.m. Sorry, and thank you. Komugi Bakery."
  questions:
    - question: "お{店|みせ}が やすみの {日|ひ}は {何日|なんにち} ありますか。"
      options:
        - option: "3{日|か}"
          why: "That is 17 − 14, but から〜まで counts both ends, the 14th and the 17th."
        - "4{日|か}"
        - option: "5{日|か}"
          why: "That counts the 18th too, but the shop opens that day, from 1 p.m."
        - option: "7{日|か}"
          why: "Only Tuesday to Friday are closed, four days."
      answer: 2
      difficulty: 2
      points: ["particle-kara-made"]
      note: "This asks how many days the shop is closed. From the 14th to the 17th, both counted, is four days: {4日|よっか}."
    - question: |-
        7{月|がつ}18{日|にち}の {朝|あさ} 10{時|じ}に、パンを {買|か}いに {行|い}きました。
        どう でしたか。
      answer: "まだ お{店|みせ}が あいて いませんでした。"
      wrong:
        - option: "パンを {買|か}う ことが できました。"
          why: "The shop opened at 1 p.m., three hours later."
        - option: "お{店|みせ}は {一日|いちにち} やすみでした。"
          why: "The 18th is not a closed day. The shop opens at 1 p.m."
        - option: "お{店|みせ}は もう しまって いました。"
          why: "もう しまって says it had closed already. On the 18th it had not opened yet: まだ."
      difficulty: 2
      points: ["adverb-mada", "adverb-mou"]
      note: "This asks what happened at ten on the 18th. The sign's last line says the shop opens that day at {午後|ごご} 1{時|じ}, so at ten it was not open yet."
    - question: "お{店|みせ}が また あく のは いつですか。"
      options:
        - option: "{金曜日|きんようび}の {午後|ごご} 1{時|じ}"
          why: "Friday the 17th is the last closed day."
        - option: "{土曜日|どようび}の {午前|ごぜん} 10{時|じ}"
          why: "Saturday is right, but the shop opens in the afternoon: {午後|ごご} 1{時|じ}から."
        - "{土曜日|どようび}の {午後|ごご} 1{時|じ}"
        - option: "{日曜日|にちようび}の {午後|ごご} 1{時|じ}"
          why: "The shop opens a day earlier, on Saturday the 18th."
      answer: 3
      difficulty: 2
      note: "This asks when the shop opens again: closed until Friday the 17th, then 18{日|にち}（{土|ど}）は {午後|ごご} 1{時|じ}から."

- id: n5-d6-0028
  type: info
  status: draft
  material:
    kind: stamp-card
    shop: "カフェ まめ"
    title: "スタンプ カード"
    slots: 10
    stamped: 7
    rewards:
      - { at: 5, label: "クッキー" }
      - { at: 10, label: "コーヒー 1ぱい" }
    notes:
      - "500{円|えん} {買|か}うと、スタンプを 1つ おします。"
      - "10こに なると、コーヒーを 1ぱい どうぞ。"
  en: "A stamp card from Café Mame, ten slots, seven stamped. Slot 5: a cookie. Slot 10: a cup of coffee. One stamp for every 500 yen you spend. Ten stamps get a free coffee."
  questions:
    - question: "{今|いま}、スタンプは いくつ ありますか。"
      options:
        - "7こ"
        - "8こ"
        - "9こ"
        - "10こ"
      answer: 1
      difficulty: 1
      note: "This asks how many stamps the card has. Count the stamped circles, or read the count printed on the card: 7こ."
    - question: |-
        コーヒーを 1ぱい もらいたいです。
        あと いくら {買|か}いものを しますか。
      options:
        - option: "500{円|えん}"
          why: "That is one stamp. Three more are needed, from 7 to 10."
        - option: "1000{円|えん}"
          why: "That is two stamps. Three more are needed, from 7 to 10."
        - "1500{円|えん}"
        - option: "2000{円|えん}"
          why: "That is four stamps, one more than needed."
      answer: 3
      difficulty: 2
      note: "This asks how much more to spend for the free coffee. The coffee comes at stamp 10, and there are 7, so three more. Each stamp is 500{円|えん}: 500 × 3 = 1500円."
    - question: |-
        {今日|きょう} 1000{円|えん} {買|か}いものを しました。
        スタンプは いくつに なりますか。
      options:
        - option: "8こ"
          why: "1000円 is two lots of 500円, so two stamps, not one."
        - "9こ"
        - option: "10こ"
          why: "That would need three stamps, 1500円 of shopping."
        - option: "12こ"
          why: "That adds five stamps, but 1000円 earns two."
      answer: 2
      difficulty: 3
      note: "This asks how many stamps there are after spending 1000円 today. 500円 earns one stamp, so 1000円 earns two: 7 + 2 = 9こ."

- id: n5-d6-0029
  type: info
  status: draft
  material:
    kind: notice
    head: ["9{月|がつ}2{日|か}"]
    title: "エレベーターの てんけんの おしらせ"
    blocks:
      - text:
          - "マンションに {住|す}んで いる みなさんへ"
          - "エレベーターの てんけんを します。てんけんの {間|あいだ}は、エレベーターが つかえません。"
      - table:
          head: ["{日|ひ}にち", "{時間|じかん}"]
          rows:
            - ["9{月|がつ}10{日|か}（{木|もく}）", "10:00〜12:00"]
            - ["9{月|がつ}11{日|にち}（{金|きん}）", "13:00〜15:00"]
      - text:
          - "かいだんを つかって ください。"
    foot: ["さくら マンション かんりかいしゃ", "{以上|いじょう}"]
  en: "A notice dated 2 September, to everyone living in the building: the lift will be inspected, and cannot be used during the inspection. Thursday 10 September 10:00–12:00; Friday 11 September 13:00–15:00. Please use the stairs. Sakura Mansion management company."
  questions:
    - question: |-
        9{月|がつ}10{日|か}の {午前|ごぜん} 11{時|じ}に {家|いえ}へ {帰|かえ}ります。
        どう しますか。
      answer: "かいだんを つかいます。"
      wrong:
        - option: "エレベーターを つかいます。"
          why: "The lift is out of use from 10:00 to 12:00 on the 10th."
        - option: "かんりかいしゃに {電話|でんわ}を します。"
          why: "The notice already says what to do: use the stairs."
        - option: "{午後|ごご} 3{時|じ}まで {外|そと}で {待|ま}ちます。"
          why: "15:00 is the end of the 11th's check, not the 10th's, and the stairs work anyway."
        - option: "マンションに {入|はい}る ことが できません。"
          why: "Only the lift is out. The stairs can still be used."
      difficulty: 2
      note: "This asks what to do at 11 a.m. on the 10th. The notice's table gives the 10th 10:00〜12:00, and 11 is inside it, so the lift is out. The notice says: かいだんを つかって ください."
    - question: "エレベーターが つかえない {時間|じかん}は、ぜんぶで {何時間|なんじかん}ですか。"
      options:
        - option: "1{時間|じかん}"
          why: "Each day's check is two hours, and there are two days."
        - option: "2{時間|じかん}"
          why: "That counts only one day. There are two."
        - option: "3{時間|じかん}"
          why: "Each day is two hours: 2 + 2 = 4."
        - "4{時間|じかん}"
      answer: 4
      difficulty: 2
      note: "This asks the total time the lift is out: 10:00〜12:00 on the 10th and 13:00〜15:00 on the 11th, two hours each, 4{時間|じかん}."
    - question: "9{月|がつ}11{日|にち}の {午前中|ごぜんちゅう}、エレベーターは どうですか。"
      answer: "つかう ことが できます。"
      wrong:
        - option: "つかう ことが できません。"
          why: "The 11th's check is in the afternoon, 13:00〜15:00."
        - option: "10{時|じ}から 12{時|じ}まで つかえません。"
          why: "10:00〜12:00 is the 10th's check, not the 11th's."
        - option: "{午前|ごぜん} 11{時|じ}まで つかえません。"
          why: "No check ends at 11. The 11th's runs 13:00〜15:00."
      difficulty: 2
      note: "This asks about the lift on the morning of the 11th. The table gives the 11th 13:00〜15:00, the afternoon, so in the morning the lift works."

- id: n5-d6-0030
  type: info
  status: draft
  material:
    kind: stop-timetable
    mode: train
    stop: "さくら{駅|えき}　2ばんせん"
    bound: "{東京|とうきょう}ゆき"
    columns: ["{月|げつ}〜{金|きん}", "{土|ど}・{日|にち}"]
    rows:
      - { hour: 6, minutes: [["15", "40●", "55"], ["20", "50"]] }
      - {
          hour: 7,
          minutes: [["05", "12●", "20", "33", "45●", "52"], ["20", "45●"]]
        }
      - {
          hour: 8,
          minutes: [["00", "10●", "18", "30", "42●", "50"], ["10", "35●", "55"]]
        }
      - { hour: 9, minutes: [["05", "25●", "45"], ["15", "40●"]] }
    notes:
      - "● かいそく：みなみ{駅|えき}に とまりません。"
      - "{東京|とうきょう}まで ふつうは 40{分|ぷん}、かいそくは 30{分|ぷん}です。"
  en: "The timetable on platform 2 at Sakura Station, trains to Tokyo. Monday to Friday and Saturday-Sunday columns, by hour; ● marks a rapid train, which does not stop at Minami. To Tokyo, a local train takes 40 minutes and a rapid 30."
  questions:
    - question: |-
        {土曜日|どようび}の {朝|あさ} 8{時|じ}に {駅|えき}に {着|つ}きました。
        つぎの {電車|でんしゃ}は {何時|なんじ}ですか。
      options:
        - option: "8:00"
          why: "8:00 is in the weekday column, 月〜金."
        - "8:10"
        - option: "8:18"
          why: "8:18 is in the weekday column, 月〜金."
        - option: "8:35"
          why: "There is an earlier Saturday train, 8:10."
      answer: 2
      difficulty: 2
      note: "This asks for the next Saturday train after eight. Saturday uses the 土・日 column, and its 8 row starts with 10: 8:10."
    - question: |-
        {月曜日|げつようび}の 7{時|じ}10{分|ぷん}に {駅|えき}に {着|つ}きました。
        つぎに {来|く}る、みなみ{駅|えき}に とまる {電車|でんしゃ}は {何時|なんじ}ですか。
      answer: "7:20"
      wrong:
        - option: "7:12"
          why: "7:12 has a ●: it is a かいそく, which does not stop at みなみ駅."
        - option: "7:05"
          why: "7:05 has already gone. It is 7:10."
        - option: "7:33"
          why: "7:33 stops there, but 7:20 comes first."
        - option: "7:45"
          why: "7:45 has a ●, and 7:20 comes first anyway."
      difficulty: 3
      note: "This asks for the next train after 7:10 on a Monday that stops at みなみ駅. The key under the timetable says ● trains are かいそく, which do not stop there. After 7:10 come 7:12● and then 7:20, so 7:20."
    - question: |-
        {月曜日|げつようび}です。
        {東京|とうきょう}に 8{時|じ}50{分|ぷん}までに {着|つ}きたいです。
        いちばん おそい {電車|でんしゃ}は どれですか。
      options:
        - option: "7:52"
          why: "7:52 + 40分 is 8:32, in time, but later trains are in time too."
        - option: "8:00"
          why: "8:00 + 40分 is 8:40, in time, but the 8:10 leaves later and is still in time."
        - "8:10"
        - option: "8:18"
          why: "8:18 is a ふつう: 40分 later is 8:58, after 8:50."
      answer: 3
      difficulty: 3
      note: "This asks for the latest Monday train that reaches 東京 by 8:50. The key gives the ride: ふつう 40{分|ぷん}, かいそく 30{分|ぷん}. The 8:10● is a かいそく and arrives at 8:40."
