# 問題6 情報検索 — information to search, shown as a picture, and a question that needs it.
#
# The picture holds only the information: never the options. Its `material` is structured data, and a template in src/handlers/exam/material/ draws it, so an edit here is a reviewable diff.
#
# Each picture is a kind of document that someone living in Japan really meets, drawn to look like one: a bus-stop timetable, a receipt, a meal-ticket machine, a medicine bag, a delivery slip, a group chat. `kind` picks the template. The paper kinds (notice, sign, signboard, poster, board, chalkboard, flyer, whiteboard, directory, timetable) share one shape: a title, then blocks of `text`, `table`, `lists` or `panels`. Every other kind has a shape of its own, in items.ts. Students learn where each kind keeps its information, so keep each one true to the real thing.
#
# The picture must hold everything a question needs. A rubbish calendar marks days with colours, so it carries the legend that says which rubbish each colour is: no answer may rest on knowing how a town sorts its rubbish. The build checks the sums on a receipt, the columns of a timetable and the legend of a calendar.
#
# Realism gives way to the kanji rule: a kanji above N4 is written in kana (ふつう, not 普通), as the paper would.
#
# A tall picture may need opening at full size. That is fine, and the 問題6 timer must allow for it.
#
# One picture serves several questions, and a test asks one. Questions combine conditions, as the paper's do: a budget, then the cheapest; a time, then the latest bus. Same rules as 問題4 otherwise (see short.yaml).

- id: n5-d6-0001
  type: info
  status: reviewed
  material:
    kind: machine
    variant: tickets
    title: "さくら しょくどう"
    groups:
      - head: "{食|た}べもの"
        tone: orange
        buttons:
          - { name: "カレー", price: 600 }
          - { name: "ラーメン", price: 550 }
          - { name: "うどん", price: 450 }
          - { name: "おにぎり", price: 200 }
      - head: "{飲|の}みもの"
        tone: blue
        buttons:
          - { name: "コーヒー", price: 250, mark: "{売|う}り{切|き}れ" }
          - { name: "こうちゃ", price: 250 }
          - { name: "ジュース", price: 200 }
          - { name: "ミルク", price: 150 }
    notes:
      - "しょっけんを {買|か}って、カウンターへ どうぞ。"
  en: "Sakura Diner's meal-ticket machine. Food: curry 600 yen, ramen 550 yen, udon 450 yen, rice ball 200 yen. Drinks: coffee 250 yen (sold out), black tea 250 yen, juice 200 yen, milk 150 yen. Sticker: buy a meal ticket, then take it to the counter."
  questions:
    - question: |-
        マリアさんは お{金|かね}が 700{円|えん} あります。
        {食|た}べものを {一|ひと}つと {飲|の}みものを {一|ひと}つ たのみたいです。
        どれを たのむ ことが できますか。
      answer: "うどんと ジュース"
      wrong:
        - "カレーと ミルク"
        - "ラーメンと ジュース"
        - "うどんと コーヒー"
        - "カレーと こうちゃ"
      difficulty: 2
      note: "うどん 450{円|えん} + ジュース 200{円|えん} = 650{円|えん}. うどんと コーヒー is exactly 700{円|えん}, but the コーヒー button says {売|う}り{切|き}れ: sold out. Every other pair costs 750{円|えん} or more."
    - question: |-
        いちばん {安|やす}い {食|た}べものと、いちばん {安|やす}い {飲|の}みものを たのみます。
        ぜんぶで いくらですか。
      options:
        - "250{円|えん}"
        - "300{円|えん}"
        - "350{円|えん}"
        - "400{円|えん}"
      answer: 3
      difficulty: 2
      note: "The cheapest food is おにぎり (200{円|えん}) and the cheapest drink is ミルク (150{円|えん}): 350{円|えん}."
    - question: |-
        {田中|たなか}さんは 1000{円|えん} {持|も}って います。
        ラーメンと こうちゃを たのみました。
        おつりは いくらですか。
      options:
        - "150{円|えん}"
        - "200{円|えん}"
        - "250{円|えん}"
        - "300{円|えん}"
      answer: 2
      difficulty: 3
      note: "ラーメン 550{円|えん} + こうちゃ 250{円|えん} = 800{円|えん}. おつり, the change, is 1000 − 800 = 200{円|えん}."

