  en: "Sakura Department Store. Floor guide: 5th floor restaurants; 4th floor books, notebooks, pens; 3rd floor children's clothes, toys; 2nd floor adults' clothes; 1st floor shoes, bags, umbrellas; basement food and drinks. Open 10:00–20:00 (restaurants 11:00–22:00)."
  questions:
    - question: |-
        あたらしい くつを {買|か}いたいです。
        {何|なん}かいへ {行|い}きますか。
      options:
        - "1かい"
        - "2かい"
        - "3かい"
        - option: "ちか1かい"
          why: "ちか1かい, the basement, is food and drinks."
      answer: 1
      difficulty: 1
      note: "This asks which floor sells shoes. A store directory lists each floor with what it sells: くつ is on 1かい."
    - question: |-
        {妹|いもうと}は 6さいです。
        {妹|いもうと}の {服|ふく}と、{妹|いもうと}に あげる {本|ほん}を {買|か}います。
        {何|なん}かいと {何|なん}かいへ {行|い}きますか。
      answer: "3かいと 4かい"
      wrong:
        - option: "2かいと 4かい"
          why: "2かい is 大人の 服, clothes for adults. A six-year-old needs 子どもの 服."
        - option: "3かいと 5かい"
          why: "5かい is restaurants. Books are on 4かい."
        - option: "2かいと 3かい"
          why: "2かい is clothes for adults, and neither floor sells books."
        - option: "1かいと 4かい"
          why: "1かい is shoes, bags and umbrellas, not clothes."
      difficulty: 2
      note: "This asks which two floors sell a six-year-old's clothes and a book. 子どもの 服 is on 3かい, and books are on 4かい."
    - question: |-
