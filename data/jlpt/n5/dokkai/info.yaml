# 問題6 情報検索 — information to search, shown as a picture, and a question that needs it.
#
# The picture holds only the information: never the options. Its `material` is structured data, and a template in src/handlers/exam/material/ draws it, so an edit here is a reviewable diff.
#
# Each picture is a kind of document that someone living in Japan really meets, drawn to look like one: a bus-stop timetable, a receipt, a meal-ticket machine, a medicine bag, a delivery slip, a group chat. `kind` picks the template. The paper kinds (notice, sign, signboard, poster, board, chalkboard, flyer, whiteboard, directory, timetable) share one shape: a title, then blocks of `text`, `table`, `lists` or `panels`. Every other kind has a shape of its own, in items.ts. Students learn where each kind keeps its information, so keep each one true to the real thing.
#
# The picture must hold everything a question needs. A rubbish calendar marks days with colours, so it carries the legend that says which rubbish each colour is: no answer may rest on knowing how a town sorts its rubbish. The build checks the sums on a receipt, the columns of a timetable and the legend of a calendar.
#
# Realism gives way to the kanji rule: a kanji above N4 is written in kana (ふつう, not 普通), as the paper would.
#
# A tall picture may need opening at full size. That is fine, and the 問題6 timer must allow for it.
#
# One picture serves several questions, and a test asks one. Questions combine conditions, as the paper's do: a budget, then the cheapest; a time, then the latest bus. Same rules as 問題4 otherwise (see short.yaml).

- id: n5-d6-0001
  type: info
  status: draft
  material:
    kind: machine
    variant: tickets
    title: "さくら しょくどう"
    groups:
      - head: "{食|た}べもの"
        tone: orange
        buttons:
          - { name: "カレー", price: 600 }
          - { name: "ラーメン", price: 550 }
          - { name: "うどん", price: 450 }
          - { name: "おにぎり", price: 200 }
      - head: "{飲|の}みもの"
        tone: blue
        buttons:
          - { name: "コーヒー", price: 250, mark: "{売|う}り{切|き}れ" }
          - { name: "こうちゃ", price: 250 }
          - { name: "ジュース", price: 200 }
          - { name: "ミルク", price: 150 }
    notes:
      - "しょっけんを {買|か}って、カウンターへ どうぞ。"
  en: "Sakura Diner's meal-ticket machine. Food: curry 600 yen, ramen 550 yen, udon 450 yen, rice ball 200 yen. Drinks: coffee 250 yen (sold out), black tea 250 yen, juice 200 yen, milk 150 yen. Sticker: buy a meal ticket, then take it to the counter."
  questions:
    - question: |-
        マリアさんは お{金|かね}が 700{円|えん} あります。
        {食|た}べものを {一|ひと}つと {飲|の}みものを {一|ひと}つ たのみたいです。
        どれを たのむ ことが できますか。
      answer: "うどんと ジュース"
      wrong:
        - option: "カレーと ミルク"
          why: "600円 + 150円 = 750円, over 700円."
        - option: "ラーメンと ジュース"
          why: "550円 + 200円 = 750円, over 700円."
        - option: "うどんと コーヒー"
          why: "Exactly 700円, but the コーヒー button says 売り切れ: sold out."
        - option: "カレーと こうちゃ"
          why: "600円 + 250円 = 850円, over 700円."
      difficulty: 2
      note: "This asks which food-and-drink pair fits in 700円. On a ticket machine each button shows its price, and a lit 売り切れ means sold out. うどん 450円 + ジュース 200円 = 650円."
    - question: |-
        いちばん {安|やす}い {食|た}べものと、いちばん {安|やす}い {飲|の}みものを たのみます。
        ぜんぶで いくらですか。
      options:
        - option: "250{円|えん}"
          why: "That is less than the cheapest pair, おにぎり 200円 + ミルク 150円."
        - option: "300{円|えん}"
          why: "That needs a 100円 drink, and the cheapest drink is ミルク, 150円."
        - "350{円|えん}"
        - option: "400{円|えん}"
          why: "That pairs おにぎり with ジュース, 200円, but ミルク is cheaper at 150円."
      answer: 3
      difficulty: 2
      note: "This asks the total for the cheapest food and the cheapest drink: おにぎり 200円 and ミルク 150円, so 350円."
    - question: |-
        {田中|たなか}さんは 1000{円|えん} {持|も}って います。
        ラーメンと こうちゃを たのみました。
        おつりは いくらですか。
      options:
        - option: "150{円|えん}"
          why: "That means a meal of 850円, as with カレー and こうちゃ."
        - "200{円|えん}"
        - option: "250{円|えん}"
          why: "That means a meal of 750円, but こうちゃ is 250円, not 200円."
        - option: "300{円|えん}"
          why: "That means a meal of 700円, but ラーメン is 550円 and こうちゃ 250円."
      answer: 2
      difficulty: 3
      note: "This asks for the change from 1000円. ラーメン 550円 + こうちゃ 250円 = 800円, and おつり is 1000 − 800 = 200円."

- id: n5-d6-0002
  type: info
  status: draft
  material:
    kind: calendar
    title: "みどり {図書館|としょかん}　3{月|がつ}"
    week:
      [
        "{日|にち}",
        "{月|げつ}",
        "{火|か}",
        "{水|すい}",
        "{木|もく}",
        "{金|きん}",
        "{土|ど}"
      ]
    first: 0
    days: 31
    legend:
      - {
          tone: red,
          short: "やすみ",
          label: "{図書館|としょかん}は やすみです"
        }
      - { tone: purple, short: "そうじ", label: "そうじの {日|ひ}：やすみです" }
    marks:
      - { day: 2, tone: red }
      - { day: 9, tone: red }
      - { day: 16, tone: red }
      - { day: 23, tone: red }
      - { day: 26, tone: purple }
      - { day: 30, tone: red }
    notes:
      - "{火|か}〜{金|きん}　9:00〜19:00"
      - "{土|ど}　9:00〜17:00"
      - "{日|にち}　10:00〜17:00"
      - "{本|ほん}は 5さつまで、2{週間|しゅうかん} {借|か}りる ことが できます。"
  en: "Midori Library, March. Closed every Monday (the 2nd, 9th, 16th, 23rd and 30th), and on Thursday the 26th for cleaning. Open Tuesday to Friday 9:00–19:00, Saturday 9:00–17:00, Sunday 10:00–17:00. You can borrow up to five books for two weeks."
  questions:
    - question: "3{月|がつ}に {図書館|としょかん}が やすみの {日|ひ}は {何日|なんにち} ありますか。"
      options:
        - option: "4{日|か}"
          why: "There are five red Mondays alone, before the cleaning day is counted."
        - option: "5{日|か}"
          why: "That counts the five red Mondays but misses the そうじ day, the 26th: そうじの {日|ひ}：やすみです."
        - "6{日|か}"
        - option: "7{日|か}"
          why: "Only six days are marked: five Mondays and the 26th. Sundays are open, 10:00〜17:00."
      answer: 3
      difficulty: 2
      note: "This asks how many days the library is closed in March. On this calendar each colour is a kind of day, and the legend says which: five red やすみ Mondays, plus the そうじ day, the 26th, which is closed too. 6日 (むいか)."
    - question: "{土曜日|どようび}、{図書館|としょかん}は {何時|なんじ}に しまりますか。"
      options:
        - "{午後|ごご}5{時|じ}"
        - option: "{午後|ごご}6{時|じ}"
          why: "No hours line ends at 18:00."
        - option: "{午後|ごご}7{時|じ}"
          why: "19:00, 午後7時, is the closing time on weekdays, 火〜金."
        - option: "{午後|ごご}9{時|じ}"
          why: "9 is the opening time, in the morning: 9:00〜."
      answer: 1
      difficulty: 2
      note: "This asks when the library closes on Saturday. The hours line for 土 says 9:00〜17:00, and 17:00 is 午後5時."
    - question: |-
        {今日|きょう}は 3{月|がつ} 10{日|か}です。
        {本|ほん}を 3さつ {借|か}ります。
        いつまでに かえしますか。
      options:
        - option: "3{月|がつ} 17{日|にち}"
          why: "That is one week, but books are lent for two: 2{週間|しゅうかん}."
        - option: "3{月|がつ} 23{日|にち}"
          why: "The 23rd is a red Monday, when the library is closed, and two weeks run to the 24th."
        - "3{月|がつ} 24{日|か}"
        - option: "3{月|がつ} 31{日|にち}"
          why: "That is three weeks, not two."
      answer: 3
      difficulty: 3
      note: "This asks when to return books borrowed today, the 10th. Books are lent for 2{週間|しゅうかん}, two weeks, and two weeks from Tuesday the 10th is Tuesday the 24th, an open day."

- id: n5-d6-0003
  type: info
  status: draft
  material:
    kind: stop-timetable
    mode: bus
    stop: "{駅前|えきまえ}　1ばん のりば"
    bound: "{大学|だいがく}ゆき"
    columns: ["{月|げつ}〜{金|きん}", "{土|ど}・{日|にち}"]
    rows:
      - { hour: 7, minutes: [["10", "30", "50"], ["30"]] }
      - { hour: 8, minutes: [["05", "20", "40", "55"], ["30"]] }
      - { hour: 9, minutes: [["10", "40"], ["30"]] }
      - { hour: 10, minutes: [["10", "40"], ["30"]] }
    notes:
      - "{大学|だいがく}まで 25{分|ふん}です。"
  en: "Timetable at Ekimae (in front of the station), stop 1, for buses to the university. Monday to Friday: 7:10, 7:30, 7:50, 8:05, 8:20, 8:40, 8:55, 9:10, 9:40, 10:10, 10:40. Saturday and Sunday: 7:30, 8:30, 9:30, 10:30. It takes 25 minutes to the university."
  questions:
    - question: |-
        {月曜日|げつようび}です。
        {大学|だいがく}に 9{時|じ}までに {着|つ}きたいです。
        でも、{朝|あさ}は ゆっくり したいです。
        {何時|なんじ}の バスに {乗|の}りますか。
      options:
        - option: "8:05"
          why: "It arrives in time, at 8:30, but the question wants a slow morning: the latest bus that is still in time."
        - "8:20"
        - option: "8:40"
          why: "8:40 + 25分 is 9:05, after nine."
        - option: "8:55"
          why: "8:55 + 25分 is 9:20, after nine."
      answer: 2
      difficulty: 2
      note: "This asks for the latest weekday bus that still reaches the university before nine. On a bus-stop timetable the hours run down the side and the minutes run across, in the weekday column, 月〜金. The ride is 25{分|ふん}, so the 8:20 bus arrives at 8:45."
    - question: |-
        {土曜日|どようび}の {朝|あさ} 8{時|じ}に バスていに {来|き}ました。
        つぎの バスは {何時|なんじ}ですか。
      options:
        - option: "8:05"
          why: "8:05 is in the weekday column, 月〜金."
        - option: "8:20"
          why: "8:20 is in the weekday column, 月〜金."
        - "8:30"
        - option: "9:30"
          why: "There is an earlier Saturday bus, 8:30."
      answer: 3
      difficulty: 2
      note: "This asks for the next Saturday bus after eight. Saturday uses the 土・日 column, where the 8 row has only 30: 8:30."
    - question: |-
        {水曜日|すいようび}に 9{時|じ}40{分|ぷん}の バスに {乗|の}ります。
        {大学|だいがく}に {何時|なんじ}に {着|つ}きますか。
      options:
        - "10:05"
        - option: "10:15"
          why: "That adds 35 minutes. The ride is 25分."
        - option: "10:25"
          why: "That adds 45 minutes. The ride is 25分."
        - option: "10:40"
          why: "10:40 is the next bus, not the arrival."
      answer: 1
      difficulty: 2
      note: "This asks when the 9:40 bus reaches the university. The note under the timetable gives the ride, {大学|だいがく}まで 25{分|ふん}: 9:40 + 25 minutes = 10:05."

- id: n5-d6-0004
  type: info
  status: draft
  material:
    kind: signboard
    tone: green
    icon: clinic
    head: ["しんりょう {時間|じかん}"]
    title: "やまだ {病院|びょういん}"
    blocks:
      - table:
          head:
            [
              "",
              "{月|げつ}",
              "{火|か}",
              "{水|すい}",
              "{木|もく}",
              "{金|きん}",
              "{土|ど}"
            ]
          rows:
            - ["{午前|ごぜん}", "○", "○", "○", "○", "○", "○"]
            - ["{午後|ごご}", "○", "○", "×", "○", "○", "×"]
      - text:
          - "○ あいて います"
          - "× やすみ"
          - "{午前|ごぜん} 9:00〜12:00"
          - "{午後|ごご} 3:00〜6:00"
          - "{日曜日|にちようび}は やすみです。"
  en: "Yamada Hospital. Mornings: open Monday to Saturday. Afternoons: open Monday, Tuesday, Thursday and Friday; closed Wednesday and Saturday. ○ open, × closed. Mornings 9:00–12:00, afternoons 3:00–6:00. Closed on Sundays."
  questions:
    - question: |-
        {午前|ごぜん}は あいて いますが、{午後|ごご}は やすみの {日|ひ}が あります。
        {何曜日|なんようび}ですか。
      options:
        - "{水曜日|すいようび}と {土曜日|どようび}"
        - option: "{水曜日|すいようび}と {日曜日|にちようび}"
          why: "Sunday is closed all day, mornings too: {日曜日|にちようび}は やすみです."
        - option: "{木曜日|もくようび}と {土曜日|どようび}"
          why: "Thursday afternoon is ○, open."
        - option: "{土曜日|どようび}と {日曜日|にちようび}"
          why: "Sunday is closed in the morning too, and the other × afternoon is Wednesday."
      answer: 1
      difficulty: 2
      note: "This asks which days are open in the morning but closed in the afternoon. A clinic sign shows the week as a grid, ○ open and × closed, and the × marks in the {午後|ごご} row are under 水 and 土."
    - question: |-
        ケンさんは {月曜日|げつようび}から {金曜日|きんようび}まで、{午前|ごぜん} 9{時|じ}から {午後|ごご} 6{時|じ}まで {仕事|しごと}を します。
        いつ {病院|びょういん}へ {行|い}きますか。
      answer: "{土曜日|どようび}の {午前|ごぜん}"
      wrong:
        - option: "{土曜日|どようび}の {午後|ごご}"
          why: "Saturday afternoon is ×, closed."
        - option: "{水曜日|すいようび}の {午後|ごご}"
          why: "Wednesday afternoon is ×, and Ken works on weekdays anyway."
        - option: "{金曜日|きんようび}の {午後|ごご}"
          why: "Ken works until 6 on Friday, and the clinic closes at 6:00."
        - option: "{日曜日|にちようび}の {午前|ごぜん}"
          why: "Sunday is closed all day: {日曜日|にちようび}は やすみです."
      difficulty: 2
      note: "This asks when Ken can go, around a job from nine to six on weekdays. The clinic closes at 6:00, so no weekday works. On Saturday the {午前|ごぜん} box is ○."
    - question: |-
        {今日|きょう}は {水曜日|すいようび}の {午後|ごご} 1{時|じ}です。
        いちばん はやく {病院|びょういん}へ {行|い}く ことが できる のは いつですか。
      options:
        - option: "{今日|きょう}の {午後|ごご} 3{時|じ}"
          why: "3:00 is when afternoons open, but Wednesday afternoon is ×."
        - option: "{今日|きょう}の {午後|ごご} 5{時|じ}"
          why: "Wednesday afternoon is ×, closed all afternoon."
        - option: "{今日|きょう}の {午後|ごご} 6{時|じ}"
          why: "6:00 is closing time, and Wednesday afternoon is closed anyway."
        - "あしたの {午前|ごぜん} 9{時|じ}"
      answer: 4
      difficulty: 3
      note: "This asks for the earliest visit from Wednesday at one. Wednesday's {午後|ごご} box is ×, so not today. Tomorrow is Thursday, and Thursday's {午前|ごぜん} box is ○: it opens at 9:00."

