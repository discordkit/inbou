- id: n5-d4-0043
  type: short
  status: draft
  intro: "これは ゆいさんが {書|か}いた にっきです。"
  text: |-
    5{月|がつ}{3日|みっか}（{土|ど}）
    {今日|きょう}は {妹|いもうと}と こうえんで テニスを する つもりでした。でも、{朝|あさ}から {雨|あめ}だったので、{近|ちか}くの {図書館|としょかん}へ {行|い}きました。{妹|いもうと}は まんがを {読|よ}んで、{私|わたし}は しゅくだいを しました。テニスは {来週|らいしゅう} します。
  en: "Saturday 3 May. Today my younger sister and I were going to play tennis in the park. But it rained from the morning, so we went to the library nearby. My sister read manga, and I did my homework. We'll play tennis next week."
  questions:
    - question: "ゆいさんは {今日|きょう} {何|なに}を しましたか。"
      answer: "{図書館|としょかん}で しゅくだいを しました。"
      wrong:
        - option: "こうえんで テニスを しました。"
          why: "That was the plan, but it rained: する つもりでした。でも…"
        - option: "{図書館|としょかん}で まんがを {読|よ}みました。"
          why: "Manga is what the sister read. Yui did homework."
        - option: "{家|いえ}で しゅくだいを しました。"
          why: "Yui did the homework at the library, not at home."
      difficulty: 2
      points: [form-tsumori]
      note: "This asks what Yui really did, not what was planned. The plan was tennis (つもりでした), but it rained, so the library, where Yui did homework."
    - question: "ふたりは いつ テニスを しますか。"
      options:
        - "{今日|きょう}"
        - "あした"
        - "あさって"
        - "{来週|らいしゅう}"
      answer: 4
      difficulty: 1
      note: "This asks when the tennis will happen now: テニスは {来週|らいしゅう} します."

