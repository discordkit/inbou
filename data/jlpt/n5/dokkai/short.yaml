    {学生|がくせい}が この {紙|かみ}を {見|み}ました。
  text: |-
    {学生|がくせい}の みなさんへ
    あしたは {午後|ごご}1{時|じ}から {図書館|としょかん}が しまります。{本|ほん}を かえす {人|ひと}は、{午前中|ごぜんちゅう}に {来|き}て ください。{午後|ごご}は {図書館|としょかん}の {入口|いりぐち}に ある はこに {本|ほん}を {入|い}れて ください。
  en: "To all students: tomorrow the library closes from 1 p.m. If you are returning books, please come in the morning. In the afternoon, please put books in the box at the library entrance."
  questions:
    - question: "あしたの {午後|ごご}、{本|ほん}を かえしたい {人|ひと}は どう しますか。"
      answer: "{入口|いりぐち}の はこに {入|い}れます。"
      wrong:
        - option: "{図書館|としょかん}の {人|ひと}に わたします。"
          why: "That works only in the morning, while the library is open: {午前中|ごぜんちゅう}に {来|き}て ください."
        - option: "{先生|せんせい}に わたします。"
          why: "The notice never mentions teachers. Books go to the library or to its box."
        - option: "つぎの {日|ひ}に かえします。"
          why: "The notice gives a way to return books in the afternoon, so there is no need to wait."
      difficulty: 2
      points: ["particle-wa-contrast"]
      note: "This asks what to do with a book tomorrow afternoon, after the library closes at one. The afternoon has its own rule: {午後|ごご}は … はこに {本|ほん}を {入|い}れて ください."
    - question: "{図書館|としょかん}は あした {何時|なんじ}に しまりますか。"
      options:
        - "12{時|じ}"
        - "1{時|じ}"
        - "2{時|じ}"
        - "5{時|じ}"
      answer: 2
      difficulty: 1
      note: "This asks when the library closes tomorrow: {午後|ごご}1{時|じ}から しまります, from one in the afternoon."

