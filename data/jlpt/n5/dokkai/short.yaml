# 問題4 内容理解（短文） — a short text, about 80 characters, and a question about it.
#
# Texts are memos, notices, emails and diaries, as on the paper. `intro` sets the scene above the text: the place in brackets, then who reads it. Spaces between phrases, kana-heavy, and every kanji N5 or N4 with a reading. Original texts only: never copy a published one.
#
# A text has one or more questions, and a test asks one of them. So a text that comes up again asks something new. Each question must be answerable from the text alone, and every wrong option must be wrong for THIS text: swap a person, a time, a place or an object the text mentions, and never make an option right by general knowledge.
#
# A question's stem is one sentence per line; the card shows each line as a heading. Options are drawn (`answer` + three or more `wrong`, shuffled) or ordered (four `options` in the paper's order + `answer` counted from 1) when they have an order of their own, such as times or days.

- id: n5-d4-0001
  type: short
  status: draft
  intro: "これは お{母|かあ}さんが ゆいさんに {書|か}いた メモです。"
  text: |-
    ゆいへ
    {今日|きょう}、お{母|かあ}さんは {仕事|しごと}で {帰|かえ}りが おそく なります。ばんごはんは テーブルの {上|うえ}に あります。6{時|じ}までに {犬|いぬ}の さんぽに {行|い}って ください。
    {母|はは}より
  en: "Yui — I have work today, so I'll be home late. Your dinner is on the table. Please take the dog for a walk by six. Mum"
  questions:
    - question: "ゆいさんは 6{時|じ}までに {何|なに}を しますか。"
      answer: "{犬|いぬ}の さんぽに {行|い}きます。"
      wrong:
        - "ばんごはんを つくります。"
        - "お{母|かあ}さんと ばんごはんを {食|た}べます。"
        - "お{母|かあ}さんの {会社|かいしゃ}へ {行|い}きます。"
      difficulty: 1
      note: "The memo asks for one thing by six: 6{時|じ}までに {犬|いぬ}の さんぽに {行|い}って ください. Dinner is already made, and Yui's mother will be home late, so they do not eat together."
    - question: "メモに あう ものは どれですか。"
      answer: "お{母|かあ}さんは {今日|きょう} おそく {帰|かえ}ります。"
      wrong:
        - "お{母|かあ}さんは {今日|きょう} {仕事|しごと}が {休|やす}みです。"
        - "ゆいさんが ばんごはんを つくります。"
        - "お{母|かあ}さんが {犬|いぬ}の さんぽに {行|い}きます。"
      difficulty: 2
      note: "{帰|かえ}りが おそく なります means Yui's mother comes home late. She is at work, the dinner is ready, and Yui walks the dog."

- id: n5-d4-0002
  type: short
  status: draft
  intro: |-
    （{学校|がっこう}で）
    {学生|がくせい}が この {紙|かみ}を {見|み}ました。
  text: |-
    {学生|がくせい}の みなさんへ
    あしたは {午後|ごご}1{時|じ}から {図書館|としょかん}が しまります。{本|ほん}を かえす {人|ひと}は、{午前中|ごぜんちゅう}に {来|き}て ください。{午後|ごご}は {図書館|としょかん}の {入口|いりぐち}に ある はこに {本|ほん}を {入|い}れて ください。
  en: "To all students: tomorrow the library closes from 1 p.m. If you are returning books, please come in the morning. In the afternoon, please put books in the box at the library entrance."
  questions:
    - question: "あしたの {午後|ごご}、{本|ほん}を かえしたい {人|ひと}は どう しますか。"
      answer: "{入口|いりぐち}の はこに {入|い}れます。"
      wrong:
        - "{図書館|としょかん}の {人|ひと}に わたします。"
        - "{先生|せんせい}に わたします。"
        - "つぎの {日|ひ}に かえします。"
      difficulty: 2
      note: "In the afternoon the library is closed, so books go in the box: {午後|ごご}は {入口|いりぐち}に ある はこに {入|い}れて ください. Handing them to the staff works only in the morning."
    - question: "{図書館|としょかん}は あした {何時|なんじ}に しまりますか。"
      options:
        - "12{時|じ}"
        - "1{時|じ}"
        - "2{時|じ}"
        - "5{時|じ}"
      answer: 2
      difficulty: 1
      note: "{午後|ごご}1{時|じ}から しまります: it closes at one in the afternoon."

- id: n5-d4-0003
  type: short
  status: draft
  intro: "これは マリアさんが {友|とも}だちの ゆきさんに {書|か}いた メールです。"
  text: |-
    ゆきさん
    {今週|こんしゅう}の {土曜日|どようび}、いっしょに {映画|えいが}を {見|み}ませんか。{映画|えいが}は 2{時|じ}からです。その {前|まえ}に、{駅|えき}の {前|まえ}の きっさてんで ひるごはんを {食|た}べましょう。12{時|じ}に きっさてんで {会|あ}いませんか。
    マリア
  en: "Yuki — would you like to see a film together this Saturday? It starts at two. Before that, let's have lunch at the café in front of the station. Shall we meet at the café at twelve? Maria"
  questions:
    - question: "ふたりは {土曜日|どようび}、はじめに {何|なに}を しますか。"
      answer: "きっさてんで ひるごはんを {食|た}べます。"
      wrong:
        - "{映画|えいが}を {見|み}ます。"
        - "{駅|えき}で {電車|でんしゃ}に {乗|の}ります。"
        - "{映画|えいが}の きっぷを {買|か}います。"
      difficulty: 1
      note: "The film is at two, and lunch comes before it: その {前|まえ}に … ひるごはんを {食|た}べましょう."
    - question: "ふたりは {何時|なんじ}に どこで {会|あ}いますか。"
      answer: "12{時|じ}に きっさてんで"
      wrong:
        - "2{時|じ}に {映画館|えいがかん}で"
        - "12{時|じ}に {駅|えき}の {中|なか}で"
        - "2{時|じ}に きっさてんで"
      difficulty: 2
      note: "12{時|じ}に きっさてんで {会|あ}いませんか: twelve, at the café. Two o'clock is when the film starts."

- id: n5-d4-0004
  type: short
  status: draft
  intro: "これは リンさんが {書|か}いた にっきです。"
  text: |-
    11{月|がつ}{3日|みっか}（{日|にち}）
    {今日|きょう}は {兄|あに}と {山|やま}に のぼりました。{昼|ひる}から {雨|あめ}が ふったので、おべんとうは {山|やま}の {下|した}の {店|みせ}で {食|た}べました。とても つかれました。
  en: "Sunday 3 November. Today I climbed a mountain with my older brother. It rained from midday, so we ate our packed lunches in a shop at the foot of the mountain. I was very tired."
  questions:
    - question: "リンさんは どこで おべんとうを {食|た}べましたか。"
      answer: "{山|やま}の {下|した}の {店|みせ}"
      wrong:
        - "{山|やま}の {上|うえ}"
        - "{兄|あに}の {家|いえ}"
        - "{駅|えき}の {近|ちか}くの {店|みせ}"
      difficulty: 1
      note: "It rained, so they ate in a shop at the foot of the mountain: {山|やま}の {下|した}の {店|みせ}で {食|た}べました."
    - question: "{昼|ひる}から {天気|てんき}は どう なりましたか。"
      answer: "{雨|あめ}が ふりました。"
      wrong:
        - "はれました。"
        - "ゆきが ふりました。"
        - "{風|かぜ}が つよく なりました。"
      difficulty: 1
      note: "{昼|ひる}から {雨|あめ}が ふった: it rained from midday."

- id: n5-d4-0005
  type: short
  status: draft
  intro: |-
    （アパートの {入口|いりぐち}で）
    アパートの {人|ひと}が この {紙|かみ}を {見|み}ました。
  text: |-
    アパートの みなさんへ
    ごみは {月曜日|げつようび}と {木曜日|もくようび}の {朝|あさ}に {出|だ}して ください。びんと かんは {水曜日|すいようび}の {朝|あさ}です。{夜|よる}に ごみを {出|だ}さないで ください。
  en: "To everyone in the building: please put rubbish out on Monday and Thursday mornings. Bottles and cans go out on Wednesday morning. Please do not put rubbish out at night."
  questions:
    - question: "びんは いつ {出|だ}しますか。"
      options:
        - "{月曜日|げつようび}の {朝|あさ}"
        - "{水曜日|すいようび}の {朝|あさ}"
        - "{木曜日|もくようび}の {朝|あさ}"
        - "{水曜日|すいようび}の {夜|よる}"
      answer: 2
      difficulty: 1
      note: "びんと かんは {水曜日|すいようび}の {朝|あさ}です: bottles and cans go out on Wednesday morning."
    - question: "びんや かんでは ない ごみは いつ {出|だ}しますか。"
      options:
        - "{月曜日|げつようび}と {水曜日|すいようび}の {朝|あさ}"
        - "{月曜日|げつようび}と {木曜日|もくようび}の {朝|あさ}"
        - "{月曜日|げつようび}と {木曜日|もくようび}の {夜|よる}"
        - "{水曜日|すいようび}と {木曜日|もくようび}の {朝|あさ}"
      answer: 2
      difficulty: 2
      note: "Other rubbish goes out on Monday and Thursday mornings. Wednesday is only for bottles and cans, and nothing goes out at night."

- id: n5-d4-0006
  type: short
  status: draft
  intro: |-
    （{教室|きょうしつ}で）
    {学生|がくせい}が この {紙|かみ}を {読|よ}みました。
  text: |-
    {来週|らいしゅう}の {水曜日|すいようび}に テストが あります。テストは 9{時|じ}からです。8{時|じ}50{分|ぷん}までに {教室|きょうしつ}に {来|き}て ください。えんぴつと けしゴムを {持|も}って きて ください。じしょは いりません。
  en: "There is a test next Wednesday. It starts at nine. Please come to the classroom by 8:50. Bring a pencil and an eraser. You do not need a dictionary."
  questions:
    - question: "{学生|がくせい}は {何時|なんじ}までに {教室|きょうしつ}に {来|き}ますか。"
      options:
        - "8{時|じ}{半|はん}"
        - "8{時|じ}50{分|ぷん}"
        - "9{時|じ}"
        - "9{時|じ}10{分|ぷん}"
      answer: 2
      difficulty: 1
      note: "The test starts at nine, but students come earlier: 8{時|じ}50{分|ぷん}までに {来|き}て ください."
    - question: "{学生|がくせい}は {何|なに}を {持|も}って {行|い}きますか。"
      answer: "えんぴつと けしゴム"
      wrong:
        - "えんぴつと じしょ"
        - "けしゴムと じしょ"
        - "じしょと ノート"
      difficulty: 2
      note: "えんぴつと けしゴムを {持|も}って きて ください. The dictionary is not needed: じしょは いりません."
