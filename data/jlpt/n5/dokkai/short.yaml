        - "たまごと {魚|さかな}"
        - "{肉|にく}と {野菜|やさい}"
      difficulty: 1
      note: "This asks what goes half price from five: {魚|さかな}と {肉|にく}が {半分|はんぶん}の ねだんに なります."

