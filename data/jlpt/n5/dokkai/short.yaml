          why: "Two is when the film starts. They meet earlier, for lunch."
        - option: "12{時|じ}に {駅|えき}の {中|なか}で"
          why: "The time is right, but they meet in the café, which is in front of the station: {駅|えき}の {前|まえ}の きっさてん."
        - option: "2{時|じ}に きっさてんで"
          why: "The place is right, but at two the film starts. They meet at twelve."
      difficulty: 2
      note: "This asks for both the time and the place they meet: 12{時|じ}に きっさてんで {会|あ}いませんか."

