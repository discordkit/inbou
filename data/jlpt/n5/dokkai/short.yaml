      note: "This asks what happened at 8 p.m. on Tuesday. The shop is open {午前|ごぜん}10{時|じ}から {午後|ごご}7{時|じ}までです, so at eight it had already closed."
    - question: "{店|みせ}で {何|なに}を {見|み}せますか。"
      answer: "この メール"
      wrong:
        - "{自転車|じてんしゃ}の かぎ"
        - "2,500{円|えん}の レシート"
        - "{名前|なまえ}の カード"
