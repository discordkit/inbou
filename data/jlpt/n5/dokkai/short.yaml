      note: "This asks what to do with a book tomorrow afternoon, after the library closes at one. The afternoon has its own rule: {午後|ごご}は … はこに {本|ほん}を {入|い}れて ください."
    - question: "{図書館|としょかん}は あした {何時|なんじ}に しまりますか。"
      options:
        - "12{時|じ}"
        - "1{時|じ}"
        - "2{時|じ}"
        - "5{時|じ}"
      answer: 2
      difficulty: 1
      note: "This asks when the library closes tomorrow: {午後|ごご}1{時|じ}から しまります, from one in the afternoon."

