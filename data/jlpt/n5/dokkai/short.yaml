        - option: "12こ"
          why: "Packs here hold ten, and the limit is two packs."
        - option: "15こ"
          why: "Packs hold ten, so two packs are twenty, not fifteen."
        - "20こ"
      answer: 4
      difficulty: 3
      points: ["particle-made-until"]
      note: "This asks how many eggs one person can buy. A pack holds 10こ, and the limit is おひとり 2パックまで: two packs, twenty eggs."
    - question: "{午後|ごご} 5{時|じ}から {半分|はんぶん}の ねだんに なるのは {何|なん}ですか。"
      answer: "{魚|さかな}と {肉|にく}"
      wrong:
