      note: "This asks what Yuta does after using the computer: パソコンを ぼくの へやに {持|も}って {行|い}って ね. ぼく is the brother who wrote the memo."

- id: n5-d4-0024
  type: short
  status: draft
  intro: |-
    （りょうで）
    りょうの {学生|がくせい}が この {紙|かみ}を {見|み}ました。
  text: |-
    せんたくきを {使|つか}う {人|ひと}へ
    せんたくきは {朝|あさ} 7{時|じ}から {夜|よる} 10{時|じ}まで {使|つか}う ことが できます。1かい 200{円|えん}です。{日曜日|にちようび}は {朝|あさ} 9{時|じ}からです。{終|お}わった {後|あと}は、すぐ {服|ふく}を {出|だ}して ください。
  en: "To washing-machine users: the machines can be used from 7 a.m. to 10 p.m. One wash costs 200 yen. On Sundays, they start at 9 a.m. When your wash finishes, please take your clothes out straight away."
  questions:
    - question: "{日曜日|にちようび}は {何時|なんじ}から せんたくきを {使|つか}う ことが できますか。"
      options:
        - option: "{朝|あさ} 7{時|じ}"
          why: "Seven is the start on the other days. Sunday starts later."
        - option: "{朝|あさ} 8{時|じ}"
          why: "No time in the notice is eight."
        - "{朝|あさ} 9{時|じ}"
        - option: "{朝|あさ} 10{時|じ}"
          why: "The notice's 10{時|じ} is at night, the closing time: {夜|よる} 10{時|じ}まで."
      answer: 3
      difficulty: 2
      points: ["particle-wa-contrast"]
      note: "This asks when Sunday's washing starts. Most days start at seven, but Sunday is set apart: {日曜日|にちようび}は {朝|あさ} 9{時|じ}からです."
    - question: |-
        せんたくきを 2かい {使|つか}います。
        いくら はらいますか。
      options:
        - "400{円|えん}"
        - option: "500{円|えん}"
          why: "One wash is 200{円|えん}, so two are 400{円|えん}."
        - option: "600{円|えん}"
          why: "600{円|えん} would be three washes."
        - option: "800{円|えん}"
          why: "800{円|えん} would be four washes."
      answer: 1
      difficulty: 2
      note: "This asks what two washes cost: 1かい 200{円|えん}, so two washes are 400{円|えん}."

