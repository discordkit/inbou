      answer: "{車|くるま}を {止|と}めても、おかねは はらいません。"
      wrong:
        - option: "1{時間|じかん} 200{円|えん}です。"
          why: "The note says it costs nothing: おかねは いりません."
        - option: "{午後|ごご} 3{時|じ}から {使|つか}う ことが できます。"
          why: "The car moves there by nine, before the work starts, not at three."
        - option: "アパートの {後|うし}ろに あります。"
          why: "It is next door: となりの ちゅうしゃじょう."
      difficulty: 2
      note: "This asks which sentence is true of the car park. It is next door and free: おかねは いりません."

- id: n5-d4-0041
