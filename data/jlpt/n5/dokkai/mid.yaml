        - "{日本|にほん}の ゲームが あまり {好|す}きでは ありません。"
        - "{毎日|まいにち} すしを {食|た}べました。"
      difficulty: 1
      note: "This asks which sentence is true of the brother: いちばん {好|す}きだった {日本|にほん}の {食|た}べ{物|もの}は ラーメンです."

- id: n5-d5-0010
  type: mid
  status: draft
  intro: "これは ユンさんが {書|か}いた さくぶんです。"
  text: |-
    {来週|らいしゅう}の {金曜日|きんようび}は、{友|とも}だちの みかさんの たんじょうびです。はじめは {花|はな}を あげたいと {思|おも}いましたが、みかさんの へやは せまくて、{花|はな}を おく ところが ありません。{本|ほん}も {考|かんが}えましたが、みかさんは {本|ほん}を たくさん {持|も}って います。
    きのう、みかさんと きっさてんへ {行|い}きました。その {店|みせ}で みかさんは {白|しろ}い カップを {見|み}て、「かわいいね」と {言|い}いました。{小|ちい}さい {花|はな}の えが ある カップでした。
    {私|わたし}は みかさんと わかれた {後|あと}で、その {店|みせ}に もどって、カップを {買|か}いました。{金曜日|きんようび}が {楽|たの}しみです。
  en: 'Next Friday is my friend Mika''s birthday. At first I wanted to give flowers, but Mika''s room is small, and there is nowhere to put flowers. I also thought about a book, but Mika has lots of books. Yesterday I went to a café with Mika. In the café, Mika looked at a white cup and said, "Cute!" It was a cup with little flowers painted on it. After Mika and I said goodbye, I went back to the café and bought the cup. I am looking forward to Friday.'
  questions:
    - question: "ユンさんは どうして {花|はな}を あげませんか。"
      answer: "みかさんの へやが せまいから"
      wrong:
        - "みかさんは {花|はな}が きらいだから"
        - "{花|はな}は {高|たか}いから"
        - "みかさんの へやが {暗|くら}いから"
      difficulty: 1
      note: "This asks why Yun gives no flowers: みかさんの へやは せまくて、{花|はな}を おく ところが ありません."
    - question: "ユンさんは どうして {本|ほん}を あげませんか。"
      answer: "みかさんは {本|ほん}を たくさん {持|も}って いるから"
      wrong:
        - option: "みかさんは {本|ほん}を {読|よ}まないから"
          why: "Mika has lots of books. The essay never says Mika does not read."
        - option: "{本|ほん}は {重|おも}いから"
          why: "The essay says nothing about weight."
        - option: "{本|ほん}の {店|みせ}が {遠|とお}いから"
          why: "The essay never mentions a bookshop."
      difficulty: 2
      note: "This asks why Yun gives no book: みかさんは {本|ほん}を たくさん {持|も}って います."
    - question: "みかさんは {何|なに}を {見|み}て「かわいいね」と {言|い}いましたか。"
      answer: "{花|はな}の えが ある {白|しろ}い カップ"
      wrong:
        - option: "{白|しろ}い {花|はな}"
          why: "The flowers are only a picture on the cup. Mika looked at the cup."
        - option: "{花|はな}の えが ある {白|しろ}い {本|ほん}"
          why: "The white thing with flowers on it is a cup, not a book."
        - option: "きっさてんの {花|はな}"
          why: "Mika looked at a cup in the café, not at flowers."
      difficulty: 2
      points: ["clause-noun-modifier"]
      note: "This asks what Mika called cute: a {白|しろ}い カップ with {小|ちい}さい {花|はな}の え on it."
    - question: "ユンさんは いつ プレゼントを {買|か}いましたか。"
      answer: "きのう みかさんと わかれた {後|あと}"
      wrong:
        - option: "きのう みかさんと いっしょに いた とき"
