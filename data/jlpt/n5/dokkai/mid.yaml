      note: "This asks what kind of shop the café is: {店|みせ}は {古|ふる}いですが、とても しずかです."
    - question: "ケイトさんは {毎週|まいしゅう} {土曜日|どようび}、きっさてんで {何|なに}を しますか。"
      answer: "コーヒーを {飲|の}んで、{本|ほん}を {読|よ}みます。"
      wrong:
        - "コーヒーを {飲|の}んで、{日本語|にほんご}を {勉強|べんきょう}します。"
        - "{友|とも}だちと コーヒーを {飲|の}みます。"
        - "きっさてんで アルバイトを します。"
