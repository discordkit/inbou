  en: "Last month I caught a cold and missed school for three days. On the first day I had a high fever and could not eat anything. Daniel, from my class, came to my apartment on the way home from school. Daniel brought fruit and drinks, and also gave me copies of the class notes. On Monday I went to school. Because I had the copies of the notes, I understood the lessons well. Daniel's birthday is next month. To say thank you, I want to give Daniel some sweets from my country."
  questions:
    - question: "アリさんは かぜを ひいた はじめの {日|ひ}、どう でしたか。"
      answer: "ねつが {高|たか}くて、{何|なに}も {食|た}べませんでした。"
      wrong:
        - option: "ねつは ありませんでしたが、{何|なに}も {食|た}べませんでした。"
          why: "Ali did have a fever, and a high one: ねつが {高|たか}くて."
        - option: "ねつが {高|たか}かったですが、くだものを {食|た}べました。"
          why: "Ali ate nothing that day. The fruit came later, with Daniel."
        - option: "{学校|がっこう}へ {行|い}きましたが、すぐ {帰|かえ}りました。"
          why: "Ali stayed home for three days: {3日|みっか} {学校|がっこう}を {休|やす}みました."
      difficulty: 2
      points: ["form-te-link"]
      note: "This asks how Ali was on the first day of the cold. Both halves matter: ねつが {高|たか}くて、{何|なに}も {食|た}べる ことが できませんでした."
    - question: "ダニエルさんは いつ アリさんの アパートへ {来|き}ましたか。"
      answer: "{学校|がっこう}の {帰|かえ}りに"
      wrong:
        - "{学校|がっこう}へ {行|い}く {前|まえ}に"
        - "{月曜日|げつようび}の {朝|あさ}に"
        - "{日曜日|にちようび}の {夜|よる}に"
      difficulty: 1
      note: "This asks when Daniel came: {学校|がっこう}の {帰|かえ}りに, on the way home from school."
    - question: "アリさんは どうして {月曜日|げつようび}の じゅぎょうが よく わかりましたか。"
      answer: "ダニエルさんに もらった ノートの コピーが あったから"
      wrong:
        - option: "{先生|せんせい}が アパートに {来|き}たから"
          why: "The visitor was Daniel, a classmate, not the teacher."
        - option: "{休|やす}みの {間|あいだ}、{一人|ひとり}で {勉強|べんきょう}したから"
          why: "The essay never says Ali studied while ill. The notes helped."
        - option: "ダニエルさんが {学校|がっこう}で {教|おし}えたから"
          why: "Daniel gave copies of the notes. The essay never says Daniel taught Ali."
      difficulty: 2
      points: ["conjunction-node"]
      note: "This asks why Monday's lessons made sense: ノートの コピーが あったので. The copies came from Daniel: ノートの コピーも くれました."
    - question: "アリさんは ダニエルさんに {何|なに}を したいですか。"
      answer: "たんじょうびに おかしを あげたいです。"
      wrong:
        - option: "くだものを {持|も}って {行|い}きたいです。"
          why: "The fruit is what Daniel brought Ali."
        - "{国|くに}の {料理|りょうり}を {作|つく}りたいです。"
        - "いっしょに {国|くに}へ {行|い}きたいです。"
      difficulty: 1
      note: "This asks what Ali wants to do for Daniel: おれいに、{私|わたし}の {国|くに}の おかしを あげたい, for Daniel's birthday."

- id: n5-d5-0009
  type: mid
  status: draft
  intro: "これは ペドロさんが {書|か}いた さくぶんです。"
  text: |-
    {先週|せんしゅう}、ブラジルから {弟|おとうと}が {日本|にほん}に あそびに {来|き}ました。{弟|おとうと}は {日本|にほん}が はじめてです。{一週間|いっしゅうかん}、{私|わたし}の アパートに とまりました。
    {火曜日|かようび}は {京都|きょうと}へ {行|い}って、{古|ふる}い おてらを {見|み}ました。{弟|おとうと}は「ブラジルには __こんな {建物|たてもの}__ は ない」と {言|い}って、たくさん {写真|しゃしん}を とりました。
    {木曜日|もくようび}は {東京|とうきょう}で かいものを しました。{弟|おとうと}は {日本|にほん}の ゲームが {大好|だいす}きで、{店|みせ}で 3{時間|じかん}も ゲームを {見|み}て いました。{私|わたし}は とても つかれました。
    {弟|おとうと}が いちばん {好|す}きだった {日本|にほん}の {食|た}べ{物|もの}は ラーメンです。{毎日|まいにち} {食|た}べたいと {言|い}って いました。
  en: 'Last week my younger brother came from Brazil to visit Japan. It was my brother''s first time in Japan. My brother stayed at my apartment for a week. On Tuesday we went to Kyoto and saw old temples. My brother said, "There are no buildings like this in Brazil," and took lots of photos. On Thursday we went shopping in Tokyo. My brother loves Japanese games, and spent three whole hours looking at games in a shop. I got very tired. The Japanese food my brother liked best was ramen. My brother wanted to eat it every day.'
