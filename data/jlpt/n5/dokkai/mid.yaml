        - option: "{先週|せんしゅう} {一人|ひとり}で {店|みせ}へ {行|い}った とき"
          why: "Yun found the cup only yesterday, at the café with Mika."
      difficulty: 3
      points: ["form-ta-ato-de"]
      note: "This asks when Yun bought the present: みかさんと わかれた {後|あと}で、その {店|みせ}に もどって … {買|か}いました, after they parted, so Mika would not see."

- id: n5-d5-0011
  type: mid
  status: draft
  intro: "これは {山下|やました}{先生|せんせい}が クラスの {学生|がくせい}に {送|おく}った メールです。"
  text: |-
