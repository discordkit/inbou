      wrong:
        - option: "ケイトさんが {英語|えいご}で {話|はな}したから"
          why: "English was the first visit. Now they talk in Japanese."
        - option: "ケイトさんが {日本語|にほんご}の {本|ほん}を {読|よ}んで いたから"
          why: "The essay never says what language Kate's books are in. The owner's words follow their talks."
        - option: "ケイトさんが {日本語|にほんご}で メニューを {書|か}いたから"
          why: "The owner explained the menu in English. Kate wrote nothing."
      difficulty: 3
      note: "This asks why the owner said 「{日本語|にほんご}が {上手|じょうず}に なりましたね」. The essay sets then against now: at first Kate understood little, but {今|いま}は、おじいさんと {日本語|にほんご}で {話|はな}します."

- id: n5-d5-0007
  type: mid
  status: draft
  intro: "これは マリさんが {書|か}いた さくぶんです。"
  text: |-
    {先週|せんしゅう}の {土曜日|どようび}、{友|とも}だちの あやさんと {町|まち}の なつまつりに {行|い}きました。{私|わたし}は あやさんの ゆかたを {借|か}りて {着|き}ました。{青|あお}い ゆかたで、とても きれいでした。
    まつりには {人|ひと}が とても {多|おお}かったです。{私|わたし}たちは やきそばを {食|た}べて、ゲームを しました。
    {夜|よる} 8{時|じ}から {花火|はなび}が ありました。でも、{人|ひと}が {多|おお}くて、よく {見|み}えませんでした。それで、{近|ちか}くの {小|ちい}さい {山|やま}に のぼって {見|み}ました。{山|やま}の {上|うえ}から {見|み}た {花火|はなび}は、ほんとうに きれいでした。
    {来年|らいねん}は {国|くに}の {家族|かぞく}を つれて、また {来|き}たいです。
  en: "Last Saturday I went to the town's summer festival with my friend Aya. I borrowed one of Aya's yukata and wore it. It was a blue yukata, and very pretty. There were a lot of people at the festival. We ate yakisoba and played games. From 8 p.m. there were fireworks. But there were so many people that we could not see them well. So we climbed a small hill nearby and watched from there. The fireworks we saw from the top of the hill were really beautiful. Next year I want to bring my family from home and come again."
  questions:
    - question: "マリさんは だれに ゆかたを {借|か}りましたか。"
      answer: "あやさん"
      wrong:
        - option: "あやさんの お{母|かあ}さん"
          why: "The yukata was Aya's own: あやさんの ゆかた."
        - "{店|みせ}の {人|ひと}"
        - "{国|くに}の {家族|かぞく}"
      difficulty: 1
      note: "This asks who lent Mari the yukata: あやさんの ゆかたを {借|か}りて {着|き}ました."
    - question: "マリさんたちは まつりで {何|なに}を {食|た}べましたか。"
      answer: "やきそば"
      wrong:
        - "すし"
        - "ラーメン"
        - "カレー"
      difficulty: 1
      note: "This asks what they ate at the festival: やきそばを {食|た}べて."
    - question: "マリさんたちは どうして {山|やま}に のぼりましたか。"
      answer: "{人|ひと}が {多|おお}くて、{花火|はなび}が よく {見|み}えなかったから"
      wrong:
        - option: "{山|やま}の {上|うえ}で やきそばを {食|た}べたかったから"
          why: "They ate yakisoba at the festival, before the fireworks."
        - option: "{山|やま}の {上|うえ}で ゲームが あったから"
          why: "The games were at the festival, not on the hill."
        - option: "あやさんの {家|いえ}が {山|やま}の {上|うえ}に あるから"
          why: "The essay never says where Aya lives."
      difficulty: 2
      points: ["form-te-link"]
      note: "This asks why they climbed the hill. The crowd blocked the fireworks: {人|ひと}が {多|おお}くて、よく {見|み}えませんでした。それで … {山|やま}に のぼって {見|み}ました. それで, “so”, links the two."
    - question: "マリさんは {来年|らいねん} どう したいですか。"
      answer: "{家族|かぞく}と いっしょに まつりに {来|き}たいです。"
      wrong:
        - "あやさんと {山|やま}に のぼりたいです。"
        - "{国|くに}で まつりを したいです。"
        - "まつりで ゲームの {店|みせ}を やりたいです。"
      difficulty: 1
      note: "This asks what Mari wants to do next year: {国|くに}の {家族|かぞく}を つれて、また {来|き}たい, to come back with the family from home."

- id: n5-d5-0008
  type: mid
  status: draft
  intro: "これは アリさんが {書|か}いた さくぶんです。"
  text: |-
    {先月|せんげつ}、{私|わたし}は かぜを ひいて、{3日|みっか} {学校|がっこう}を {休|やす}みました。はじめの {日|ひ}は ねつが {高|たか}くて、{何|なに}も {食|た}べる ことが できませんでした。
    {同|おな}じ クラスの ダニエルさんが、{学校|がっこう}の {帰|かえ}りに {私|わたし}の アパートへ {来|き}ました。くだものと {飲|の}み{物|もの}を {持|も}って きて、じゅぎょうの ノートの コピーも くれました。
    {月曜日|げつようび}に {学校|がっこう}へ {行|い}きました。ノートの コピーが あったので、じゅぎょうが よく わかりました。
