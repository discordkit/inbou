    - question: "{弟|おとうと}さんは {日本|にほん}で どこに とまりましたか。"
      answer: "ペドロさんの アパート"
      wrong:
        - "{京都|きょうと}の ホテル"
        - "{東京|とうきょう}の ホテル"
        - "{友|とも}だちの {家|いえ}"
      difficulty: 1
      note: "This asks where the brother stayed: {私|わたし}の アパートに とまりました. {私|わたし} is Pedro, who wrote the essay."
    - question: "__こんな {建物|たてもの}__ とは {何|なん}ですか。"
      answer: "{京都|きょうと}の {古|ふる}い おてら"
      wrong:
        - option: "{東京|とうきょう}の ゲームの {店|みせ}"
          why: "The games came on Thursday. The brother said this in Kyoto, on Tuesday."
        - option: "ペドロさんの アパート"
          why: "The words were said at the temples in Kyoto, about them."
        - option: "ブラジルの {古|ふる}い おてら"
          why: "Brazil is where there are none: ブラジルには … ない."
      difficulty: 2
      note: "This asks what こんな {建物|たてもの}, “buildings like this”, points to. こんな points back to what they had just seen: {京都|きょうと}の {古|ふる}い おてら."
    - question: "ペドロさんは {木曜日|もくようび}、どうして つかれましたか。"
      answer: "{弟|おとうと}さんが {長|なが}い {時間|じかん} ゲームを {見|み}て いたから"
      wrong:
        - option: "{京都|きょうと}で たくさん {歩|ある}いたから"
          why: "Kyoto was Tuesday. The tiredness was on Thursday, in Tokyo."
        - option: "{一人|ひとり}で かいものを したから"
          why: "Pedro shopped with the brother, not alone."
        - option: "{弟|おとうと}さんと 3{時間|じかん} ゲームを したから"
          why: "They looked at games for three hours ({見|み}て いました). They did not play."
