      note: "This asks what Kate does there every Saturday: コーヒーを {飲|の}んで、{本|ほん}を {読|よ}みます."
    - question: "{店|みせ}の おじいさんは どうして {英語|えいご}が {上手|じょうず}ですか。"
      answer: "{前|まえ}に アメリカで {仕事|しごと}を して いたから"
      wrong:
        - option: "{英語|えいご}の {先生|せんせい}だったから"
          why: "The essay says the owner worked in America, not that the owner taught English."
        - option: "アメリカ{人|じん}だから"
          why: "The owner only worked in America when young. The essay does not say the owner is American."
        - option: "{毎日|まいにち} {英語|えいご}の {本|ほん}を {読|よ}むから"
          why: "Reading books is what Kate does at the café, not the owner."
      difficulty: 2
      note: "This asks why the owner speaks good English: わかい とき、アメリカで {働|はたら}いて いたからです. {仕事|しごと}を して いた says the same as {働|はたら}いて いた."
    - question: "おじいさんは どうして __{日本語|にほんご}が {上手|じょうず}に なりましたね__ と {言|い}いましたか。"
