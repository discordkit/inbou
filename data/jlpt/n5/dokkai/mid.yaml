# 問題5 内容理解（中文） — a text of about 250 characters, usually a student's essay, and questions about it.
#
# Same rules as 問題4 (see short.yaml): original texts, spaces between phrases, every kanji N5 or N4 with a reading, and every wrong option wrong for THIS text.
#
# A text has about four questions, written in the order the text answers them. A test asks two and keeps that order, as the paper does. So each question must stand alone: no option of one question may give away the answer to another.

- id: n5-d5-0001
  type: mid
  status: reviewed
  intro: "これは ケンさんが {書|か}いた さくぶんです。"
  text: |-
    {私|わたし}は {先月|せんげつ}から、{毎週|まいしゅう} {土曜日|どようび}に {料理|りょうり}{教室|きょうしつ}へ {行|い}って います。{教室|きょうしつ}は {駅|えき}の {近|ちか}くの ビルの 3がいに あります。
    {先生|せんせい}は {日本人|にほんじん}の おばあさんで、とても やさしいです。{先週|せんしゅう}は てんぷらを {作|つく}りました。てんぷらは むずかしかったですが、おいしく できました。
    {家|いえ}に {帰|かえ}って、{同|おな}じ アパートの {友|とも}だちに てんぷらを あげました。{友|とも}だちは「おいしい」と {言|い}って、ぜんぶ {食|た}べました。とても うれしかったです。
    {来週|らいしゅう}は すしを {作|つく}ります。すしの {写真|しゃしん}を とって、{国|くに}の {母|はは}に {送|おく}りたいです。
  en: 'Since last month I have been going to a cooking class every Saturday. The class is on the third floor of a building near the station. The teacher is a Japanese grandmother, and she is very kind. Last week we made tempura. Tempura was difficult, but it turned out delicious. When I got home, I gave the tempura to a friend who lives in the same apartment building. My friend said "delicious" and ate it all. I was very happy. Next week we will make sushi. I want to take a photo of the sushi and send it to my mother back home.'
  questions:
    - question: "{料理|りょうり}{教室|きょうしつ}は どこに ありますか。"
      answer: "{駅|えき}の {近|ちか}くの ビル"
      wrong:
        - "ケンさんの アパート"
        - "{先生|せんせい}の {家|いえ}"
        - "{駅|えき}の {中|なか}"
      difficulty: 1
      note: "This asks where the cooking class is: {駅|えき}の {近|ちか}くの ビルの 3がい."
    - question: "{先週|せんしゅう}の てんぷらは どうでしたか。"
      answer: "むずかしかったですが、おいしかったです。"
      wrong:
        - option: "かんたんで、おいしかったです。"
          why: "Tempura was hard, not easy: むずかしかったです."
        - option: "むずかしくて、おいしく なかったです。"
          why: "It was hard, but it came out well: おいしく できました."
        - option: "かんたんでしたが、おいしく なかったです。"
          why: "Both halves are the wrong way round: it was hard, and it came out well."
      difficulty: 2
      points: ["conjunction-ga-but"]
      note: "This asks how last week's tempura turned out. Both halves matter: むずかしかったですが、おいしく できました."
    - question: "ケンさんは {作|つく}った てんぷらを どう しましたか。"
      answer: "{友|とも}だちに あげました。"
      wrong:
        - "{先生|せんせい}に あげました。"
        - "{教室|きょうしつ}の みんなで {食|た}べました。"
        - option: "ぜんぶ {自分|じぶん}で {食|た}べました。"
          why: "The friend ate it all, not Ken: {友|とも}だちは … ぜんぶ {食|た}べました."
      difficulty: 1
      note: "This asks what Ken did with the tempura: {同|おな}じ アパートの {友|とも}だちに てんぷらを あげました."
    - question: "ケンさんは すしの {写真|しゃしん}を だれに {送|おく}りたいですか。"
      answer: "お{母|かあ}さん"
      wrong:
        - "{料理|りょうり}の {先生|せんせい}"
        - "アパートの {友|とも}だち"
        - "お{父|とう}さん"
      difficulty: 1
      note: "This asks who Ken wants to send the photo to: {国|くに}の {母|はは}. {母|はは} is how you speak of your own mother; お{母|かあ}さん is the polite word."

- id: n5-d5-0002
  type: mid
  status: reviewed
  intro: "これは リーさんが {書|か}いた さくぶんです。"
  text: |-
    {先週|せんしゅう}の {金曜日|きんようび}、{私|わたし}は かさを なくしました。{青|あお}くて {大|おお}きい かさです。{学校|がっこう}の {帰|かえ}りに {電車|でんしゃ}の {中|なか}に わすれたと {思|おも}いました。
    つぎの {日|ひ}、{駅|えき}へ {行|い}って、{駅|えき}の {人|ひと}に {聞|き}きました。でも、かさは ありませんでした。
    {月曜日|げつようび}に {学校|がっこう}へ {行|い}きました。{教室|きょうしつ}の うしろに {私|わたし}の かさが ありました。{金曜日|きんようび}は {朝|あさ} {雨|あめ}が ふって いましたが、{午後|ごご}は はれて いました。それで、{教室|きょうしつ}に わすれて いました。
    これからは {気|き}を つけます。
  en: "Last Friday I lost my umbrella. It is a big blue umbrella. I thought I had left it on the train on my way home from school. The next day I went to the station and asked the station staff, but the umbrella was not there. On Monday I went to school. My umbrella was at the back of the classroom. On Friday it had rained in the morning, but in the afternoon it was sunny. That is why I left it in the classroom. From now on I will be careful."
  questions:
    - question: "リーさんの かさは どんな かさですか。"
      answer: "{青|あお}くて {大|おお}きい"
      wrong:
        - "{青|あお}くて {小|ちい}さい"
        - "{黒|くろ}くて {大|おお}きい"
        - "{白|しろ}くて {小|ちい}さい"
      difficulty: 1
      note: "This asks what Lee's umbrella looks like: {青|あお}くて {大|おお}きい かさです."
    - question: "リーさんは {土曜日|どようび}に {何|なに}を しましたか。"
      answer: "{駅|えき}の {人|ひと}に かさの ことを {聞|き}きました。"
      wrong:
        - option: "{学校|がっこう}で かさを さがしました。"
          why: "Lee went back to school on Monday, not Saturday."
        - option: "あたらしい かさを {買|か}いました。"
          why: "The essay mentions no new umbrella."
        - option: "{電車|でんしゃ}の {中|なか}で かさを さがしました。"
          why: "Lee asked at the station. There is no search on a train."
      difficulty: 2
      note: "This asks what Lee did on Saturday. The umbrella was lost on Friday, and つぎの {日|ひ}, the next day, is Saturday: Lee went to the station and asked the staff."
    - question: "かさは どこに ありましたか。"
      answer: "{教室|きょうしつ}の うしろ"
      wrong:
        - option: "{電車|でんしゃ}の {中|なか}"
          why: "Lee only thought so: {電車|でんしゃ}の {中|なか}に わすれたと {思|おも}いました."
        - "{駅|えき}の {人|ひと}の ところ"
        - "{学校|がっこう}の {入口|いりぐち}"
      difficulty: 1
      note: "This asks where the umbrella really was: {教室|きょうしつ}の うしろに {私|わたし}の かさが ありました."
    - question: "リーさんは どうして かさを わすれましたか。"
      answer: "{午後|ごご}は {雨|あめ}が ふって いなかったから"
      wrong:
        - option: "{朝|あさ}は {雨|あめ}が ふって いなかったから"
          why: "The other way round: {朝|あさ} {雨|あめ}が ふって いました, and the afternoon was sunny."
        - option: "{電車|でんしゃ}が こんで いたから"
          why: "The essay never mentions a crowded train, and the umbrella was left in the classroom."
        - option: "いそいで {帰|かえ}ったから"
          why: "The essay never says Lee hurried. The reason is the weather."
      difficulty: 3
      note: "This asks why Lee forgot the umbrella. It rained in the morning, but the afternoon was sunny, so Lee needed no umbrella going home. それで, “so”, links the weather to the forgetting."

- id: n5-d5-0003
  type: mid
  status: reviewed
  intro: "これは ハンさんが {書|か}いた さくぶんです。"
  text: |-
    {私|わたし}は {毎週|まいしゅう} {日曜日|にちようび}、{家|いえ}の {近|ちか}くの パンやで アルバイトを して います。{仕事|しごと}は {朝|あさ} 6{時|じ}から 12{時|じ}までです。{朝|あさ}が {早|はや}いので、はじめは とても たいへんでした。
    {店|みせ}の {人|ひと}は みんな やさしいです。{仕事|しごと}が {終|お}わると、{店長|てんちょう}が いつも {売|う}れなかった パンを くれます。
    {先週|せんしゅう}、おきゃくさんが パンの {名前|なまえ}を {聞|き}きましたが、{私|わたし}は {答|こた}える ことが できませんでした。それから {毎日|まいにち}、パンの {名前|なまえ}を {一|ひと}つずつ おぼえました。{今|いま}は {店|みせ}の パンの {名前|なまえ}が ぜんぶ わかります。
  en: "Every Sunday I work part-time at a bakery near my home. The work is from 6 a.m. to 12. Because the mornings are early, at first it was very hard. The people at the shop are all kind. When work finishes, the manager always gives me the bread that did not sell. Last week a customer asked me the name of a bread, but I could not answer. Since then I have learned the names of the breads one at a time, every day. Now I know the names of all the bread in the shop."
  questions:
    - question: "ハンさんの アルバイトに ついて {正|ただ}しい ものは どれですか。"
      answer: "{昼|ひる}の 12{時|じ}に {終|お}わります。"
      wrong:
        - "{毎週|まいしゅう} {土曜日|どようび}に あります。"
        - "{家|いえ}から {遠|とお}い {店|みせ}で します。"
        - option: "{朝|あさ} 7{時|じ}に {始|はじ}まります。"
          why: "It starts at six: {朝|あさ} 6{時|じ}から."
      difficulty: 1
      note: "This asks which sentence is true of Han's job. The hours are {朝|あさ} 6{時|じ}から 12{時|じ}まで, so it ends at noon."
    - question: "ハンさんは どうして はじめ たいへんでしたか。"
      answer: "{朝|あさ} {早|はや}く {起|お}きるから"
      wrong:
        - option: "{仕事|しごと}が {多|おお}いから"
          why: "The essay gives one reason, the early start, not the amount of work."
        - option: "{店|みせ}の {人|ひと}が こわいから"
          why: "The opposite: {店|みせ}の {人|ひと}は みんな やさしいです."
        - option: "{店|みせ}が {家|いえ}から {遠|とお}いから"
          why: "The shop is near Han's home: {家|いえ}の {近|ちか}くの パンや."
      difficulty: 2
      points: ["conjunction-node"]
      note: "This asks why the job was hard at first: {朝|あさ}が {早|はや}いので、はじめは とても たいへんでした. An early start means getting up early."
    - question: "{店長|てんちょう}は {仕事|しごと}の {後|あと}で {何|なに}を しますか。"
      answer: "ハンさんに パンを あげます。"
      wrong:
        - "ハンさんに パンの {作|つく}り{方|かた}を {教|おし}えます。"
        - "ハンさんと ひるごはんを {食|た}べます。"
        - "ハンさんに おかねを あげます。"
      difficulty: 1
      note: "This asks what the manager does after work: {売|う}れなかった パンを くれます, gives Han the bread that did not sell."
    - question: "ハンさんは {先週|せんしゅう} どうして こまりましたか。"
      answer: "パンの {名前|なまえ}が わからなかったから"
      wrong:
        - option: "パンが {売|う}れなかったから"
          why: "Unsold bread is what the manager gives Han each week. It is not last week's problem."
        - option: "おきゃくさんが {多|おお}かったから"
          why: "One customer asked one question. The essay says nothing about many customers."
        - option: "{店長|てんちょう}が {休|やす}みだったから"
          why: "The essay never says the manager was away."
      difficulty: 2
      note: "This asks why last week was a problem. A customer asked a bread's name, and Han could not answer: {答|こた}える ことが できませんでした."

- id: n5-d5-0004
  type: mid
  status: reviewed
  intro: "これは ジョンさんが {書|か}いた さくぶんです。"
  text: |-
    {先月|せんげつ}、{私|わたし}は あたらしい アパートに ひっこしました。{前|まえ}の アパートは {駅|えき}から {近|ちか}くて べんりでしたが、へやが せまくて {暗|くら}かったです。
    あたらしい アパートは {駅|えき}から {歩|ある}いて 20{分|ぷん}ぐらい かかります。でも、へやが {広|ひろ}くて、{大|おお}きい まどが あります。{朝|あさ}は {日|ひ}が よく {入|はい}って、とても {明|あか}るいです。
    {駅|えき}まで {遠|とお}いので、{自転車|じてんしゃ}を {買|か}いました。{毎朝|まいあさ} {自転車|じてんしゃ}で {駅|えき}まで {行|い}きます。{雨|あめ}の {日|ひ}は バスに {乗|の}ります。
    となりの {人|ひと}は おばあさんで、ときどき {野菜|やさい}を くれます。{私|わたし}は この アパートが とても {好|す}きです。
  en: "Last month I moved to a new apartment. My old apartment was close to the station and convenient, but the room was small and dark. From the new apartment it takes about twenty minutes to walk to the station. But the room is big, and it has a large window. In the morning lots of sun comes in, and it is very bright. Because the station is far, I bought a bicycle. Every morning I ride to the station. On rainy days I take the bus. My neighbour is an old woman, and she sometimes gives me vegetables. I like this apartment very much."
  questions:
    - question: "{前|まえ}の アパートは どんな アパートでしたか。"
      answer: "{駅|えき}から {近|ちか}かったですが、へやが せまかったです。"
      wrong:
        - option: "{駅|えき}から {遠|とお}くて、へやが せまかったです。"
          why: "The old place was near the station. The new one is far."
        - option: "{駅|えき}から {近|ちか}くて、へやが {広|ひろ}かったです。"
          why: "The old room was small and dark. The new room is big."
        - option: "{駅|えき}から {遠|とお}かったですが、へやが {明|あか}るかったです。"
          why: "This describes the new apartment, not the old one."
      difficulty: 2
      points: ["conjunction-ga-but", "form-te-link"]
      note: "This asks what the old apartment was like. Both halves matter: {駅|えき}から {近|ちか}くて べんりでしたが、へやが せまくて {暗|くら}かった."
    - question: "あたらしい アパートの いい ところは どれですか。"
      answer: "へやが {明|あか}るい"
      wrong:
        - "へやが あたたかい"
        - option: "まどが {小|ちい}さい"
          why: "The window is big: {大|おお}きい まどが あります."
        - "{近|ちか}くに {店|みせ}が {多|おお}い"
      difficulty: 1
      note: "This asks what is good about the new apartment: {朝|あさ}は {日|ひ}が よく {入|はい}って、とても {明|あか}るいです."
    - question: "ジョンさんは {雨|あめ}の {日|ひ}、{何|なに}で {駅|えき}へ {行|い}きますか。"
      answer: "バス"
      wrong:
        - option: "{自転車|じてんしゃ}"
          why: "The bicycle is for the other mornings. Rain means the bus."
        - "タクシー"
        - "{友|とも}だちの {車|くるま}"
      difficulty: 1
      note: "This asks how John gets to the station on rainy days: {雨|あめ}の {日|ひ}は バスに {乗|の}ります."
    - question: "ジョンさんに ついて {正|ただ}しい ものは どれですか。"
      answer: "となりの {人|ひと}に {野菜|やさい}を もらいます。"
      wrong:
        - option: "となりの {人|ひと}に {野菜|やさい}を あげます。"
          why: "The other way round: the neighbour gives to John (くれます)."
        - option: "{前|まえ}の アパートの ほうが {好|す}きです。"
          why: "John likes the new one: この アパートが とても {好|す}きです."
        - option: "{毎朝|まいあさ} {駅|えき}まで {歩|ある}きます。"
          why: "John rides the new bicycle to the station each morning."
      difficulty: 2
      note: "This asks which sentence is true of John. The neighbour gives the vegetables: ときどき {野菜|やさい}を くれます. くれます means John receives them."

- id: n5-d5-0005
  type: mid
  status: reviewed
  intro: "これは ジュリアさんが ホームステイの {家族|かぞく}に {書|か}いた {手紙|てがみ}です。"
  text: |-
    {田中|たなか}さんの {家族|かぞく}の みなさんへ
    {夏休|なつやす}みの 2{週間|しゅうかん}、ほんとうに ありがとう ございました。
    みなさんと いっしょに {食|た}べた ごはんは、いつも おいしかったです。お{母|かあ}さんの カレーが いちばん {好|す}きでした。
    {休|やす}みの {日|ひ}に、お{父|とう}さんと {車|くるま}で {海|うみ}へ {行|い}きました。{海|うみ}は とても きれいでしたが、{水|みず}が つめたくて、{私|わたし}は およぎませんでした。
    {国|くに}に {帰|かえ}って から、{毎日|まいにち} {日本語|にほんご}を {勉強|べんきょう}して います。{来年|らいねん}の {夏|なつ}、また {会|あ}いに {行|い}きたいです。
    たけしくんにも よろしく。
    ジュリア
  en: "To everyone in the Tanaka family: thank you so much for the two weeks of the summer holiday. The meals we ate together were always delicious. I liked Mum's curry best. On a day off, I went to the sea by car with Dad. The sea was very beautiful, but the water was cold, so I did not swim. Since coming home, I have studied Japanese every day. Next summer I want to come and see you again. Please say hello to Takeshi too. Julia"
  questions:
    - question: "ジュリアさんは {田中|たなか}さんの {家|いえ}に どのぐらい いましたか。"
      options:
        - "2{週間|しゅうかん}"
        - "3{週間|しゅうかん}"
        - "1か{月|げつ}"
        - "2か{月|げつ}"
      answer: 1
      difficulty: 1
      note: "This asks how long Julia stayed: {夏休|なつやす}みの 2{週間|しゅうかん}, two weeks."
    - question: "ジュリアさんが いちばん {好|す}きだった {料理|りょうり}は {何|なん}ですか。"
      answer: "お{母|かあ}さんの カレー"
      wrong:
        - option: "お{父|とう}さんの カレー"
          why: "The curry was the host mother's. The father took Julia to the sea."
        - "{海|うみ}で {食|た}べた {魚|さかな}"
        - "お{母|かあ}さんの すし"
      difficulty: 1
      note: "This asks which dish Julia liked best: お{母|かあ}さんの カレーが いちばん {好|す}きでした."
    - question: "ジュリアさんは どうして {海|うみ}で およぎませんでしたか。"
      answer: "{水|みず}が つめたかったから"
      wrong:
        - option: "{海|うみ}が きれいでは なかったから"
          why: "The opposite: {海|うみ}は とても きれいでした."
        - option: "お{父|とう}さんが だめだと {言|い}ったから"
          why: "The letter never says the father stopped Julia."
        - option: "{雨|あめ}が ふって いたから"
          why: "The letter mentions no rain. The water was cold."
      difficulty: 2
      points: ["form-te-link"]
      note: "This asks why Julia did not swim: {水|みず}が つめたくて、{私|わたし}は およぎませんでした."
    - question: "{手紙|てがみ}に あう ものは どれですか。"
      answer: "ジュリアさんは もう {国|くに}に {帰|かえ}りました。"
      wrong:
        - option: "ジュリアさんは {来月|らいげつ} また {日本|にほん}へ {来|き}ます。"
          why: "The next visit is {来年|らいねん}の {夏|なつ}, next summer, not next month."
        - option: "ジュリアさんは {今|いま}も {田中|たなか}さんの {家|いえ}に います。"
          why: "Julia is writing from home: {国|くに}に {帰|かえ}って から."
        - option: "ジュリアさんは {日本語|にほんご}の {勉強|べんきょう}を やめました。"
          why: "The opposite: {毎日|まいにち} {日本語|にほんご}を {勉強|べんきょう}して います."
      difficulty: 2
      points: ["form-te-kara"]
      note: "This asks which sentence agrees with the letter: {国|くに}に {帰|かえ}って から … {勉強|べんきょう}して います, so Julia has already gone home."

- id: n5-d5-0006
  type: mid
  status: reviewed
  intro: "これは ケイトさんが {書|か}いた さくぶんです。"
  text: |-
