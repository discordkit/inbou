- {
    id: comparison-no-hou-ga,
    pattern: 〜より〜のほうが,
    meaning: … is more … than …,
    tofugu: particle-yori-than
  }
- {
    id: comparison-ichiban,
    pattern: 〜のなかで〜がいちばん,
    meaning: "of …, … is the most …",
    tofugu: naka#for-out-of
  }

- {
    id: form-polite-tense,
    pattern: 〜ます／〜ました／〜ません,
    meaning: "tense and polarity that fit the context",
    tofugu: masu
  }
- {
    id: clause-noun-modifier,
    pattern: "[clause] + noun",
    meaning: "a clause before a noun describes it: 母が 作った ケーキ",
    tofugu: sentences-and-clauses#noun-modification
  }
- {
    id: verb-kariru-kasu,
    pattern: かりる／かす,
    meaning: "borrow from (に) or lend to (に)"
  }
- {
    id: form-toki,
    pattern: 〜とき,
    meaning: when; at the time that,
    tofugu: toki
  }
- {
    id: form-kata,
    pattern: ます stem ＋ かた,
    meaning: the way of doing something
  }

# ── Set phrases ──────────────────────────────────────────────────────────────
- {
    id: phrase-o-kudasai,
    pattern: 〜をください,
    meaning: please give me …,
    tofugu: kudasai
  }
- {
    id: phrase-douzo,
    pattern: どうぞ,
    meaning: "please, go ahead; here you are"
  }
- { id: phrase-sumimasen, pattern: すみません, meaning: excuse me; sorry }
- {
    id: phrase-ikaga-desu-ka,
    pattern: 〜はいかがですか,
    meaning: would you like …?,
    tofugu: question-words#for-how
  }
- {
    id: phrase-ni-suru,
    pattern: 〜にします,
    meaning: "choose: I'll have …",
    tofugu: suru#for-selecting-or-deciding-something
  }
- {
    id: phrase-greetings,
    pattern: いってきます・ただいま,
    meaning: "set greetings for leaving home, coming home and meals"
  }
