  }
- {
    id: form-te-kara,
    pattern: 〜てから,
    meaning: after doing …,
    tofugu: particle-kara#for-continuous-actions
  }
- {
    id: form-ta-ato-de,
    pattern: 〜たあとで,
    meaning: after …,
    tofugu: mae-ushiro
  }
- {
    id: form-mae-ni,
    pattern: 〜まえに,
    meaning: "before … (with the dictionary form)",
    tofugu: mae-ushiro
  }
- {
    id: form-nagara,
    pattern: 〜ながら,
    meaning: "while … (with the ます stem)",
    tofugu: verb-nagara
  }
- {
    id: form-ni-iku,
    pattern: 〜にいく／くる,
    meaning: "go / come to do … (with the ます stem)",
