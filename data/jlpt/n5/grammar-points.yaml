# N5 grammar points that items refer to by id.
#
# Starts from Jonathan Waller's N5 grammar list (tanos.co.uk) and adds what the
# official sample paper actually tests most: particles split by function,
# question words, こそあど words, adverbs and set phrases. Cross-checked against
# Wikibooks, JLPT Sensei, Bunpro, Genki I and Minna no Nihongo I. A list of
# grammar point names is a set of facts; the meanings are our own words.
#
# Ids are permanent once an item uses them. Add freely; never rename.
#
# `tofugu` names the Tofugu grammar article a student should read after missing the point: its page under tofugu.com/japanese-grammar/, then `#section` for one part of it. Leave it out when no article covers the point. `vp run exam:links` checks that every page and section exists.

# ── Particles ────────────────────────────────────────────────────────────────
- {
    id: particle-wa-topic,
    pattern: は,
    meaning: marks the topic,
    tofugu: particle-wa#as-a-topic-marker
  }
- {
    id: particle-wa-contrast,
    pattern: は,
    meaning: "marks a contrast, often in a negative",
    tofugu: particle-wa#for-contrast
  }
- {
    id: particle-ga-subject,
    pattern: が,
    meaning: "marks the subject, or new information",
    tofugu: particle-ga
  }
- {
    id: particle-ga-object,
    pattern: が,
    meaning: "marks the object of すき, じょうず, わかる, ほしい, ある",
    tofugu: particle-ga#with-verb-like-adjectives
  }
- {
    id: particle-o-object,
    pattern: を,
    meaning: marks the direct object,
    tofugu: particle-wo#for-direct-objects
  }
- {
    id: particle-o-through,
    pattern: を,
    meaning: "marks a place left or passed through (でる, わたる, あるく)",
    tofugu: particle-wo#with-movement-verbs
  }
- {
    id: particle-ni-time,
    pattern: に,
    meaning: marks a point in time,
    tofugu: particle-ni#for-points-in-time
  }
- {
    id: particle-ni-destination,
    pattern: に,
    meaning: marks a destination,
    tofugu: particle-ni#for-location
  }
- {
    id: particle-ni-existence,
    pattern: に,
    meaning: "marks where something is (ある, いる)",
    tofugu: particle-ni#for-location
  }
- {
    id: particle-ni-recipient,
    pattern: に,
    meaning: "marks the person something goes to (あげる, あう, でんわする)",
    tofugu: particle-ni#in-social-interactions-and-transactions
  }
- {
    id: particle-ni-frequency,
    pattern: に,
    meaning: "per: いちにちに さんかい"
  }
- {
    id: particle-he-direction,
    pattern: へ,
    meaning: marks a direction,
    tofugu: particle-he#for-physical-destinations-and-directions
  }
- {
    id: particle-de-place,
    pattern: で,
    meaning: marks where an action happens,
    tofugu: particle-de#for-specifying-places
  }
- {
    id: particle-de-means,
    pattern: で,
    meaning: "marks a means or tool: by, with",
    tofugu: particle-de#for-means-of-an-action
  }
- {
    id: particle-de-total,
    pattern: で,
    meaning: "marks a total or a scope: みっつで, ぜんぶで",
    tofugu: particle-de#for-quantities-and-measurements
  }
- {
    id: particle-to-and,
    pattern: と,
    meaning: "and, listing every item",
    tofugu: particle-to#as-in-and
  }
- {
    id: particle-to-with,
    pattern: と,
    meaning: "with a person",
    tofugu: particle-to#as-in-with
  }
- {
    id: particle-to-quote,
    pattern: と（いう）,
    meaning: marks what someone says or thinks,
    tofugu: particle-to#for-marking-quotations
  }
- {
    id: particle-ya-and,
    pattern: や,
    meaning: "and, listing some items of many",
    tofugu: particle-ya
  }
- {
    id: particle-mo-also,
    pattern: も,
    meaning: "also, too",
    tofugu: particle-mo#particle--as-in-also
  }
- {
    id: particle-no-possessive,
    pattern: の,
    meaning: "of, 's: links two nouns",
    tofugu: particle-no-noun-modifier#ownership
  }
- {
    id: particle-no-pronoun,
    pattern: の,
    meaning: "one, the one: わたしの",
    tofugu: particle-no-noun-modifier#noun----noun
  }
- {
    id: particle-kara-from,
    pattern: から,
    meaning: from a starting point,
    tofugu: particle-kara
  }
- {
    id: particle-made-until,
    pattern: まで,
    meaning: "until, as far as",
    tofugu: particle-made
  }
- {
    id: particle-kara-made,
    pattern: から〜まで,
    meaning: from … to …,
    tofugu: particle-made
  }
- {
    id: particle-yori-comparison,
    pattern: より,
    meaning: than,
    tofugu: particle-yori-than
  }
- {
    id: particle-ka-question,
    pattern: か,
    meaning: makes a question,
    tofugu: particle-ka#for-asking-questions
  }
- {
    id: particle-ka-or,
    pattern: か,
    meaning: or,
    tofugu: particle-ka#for-alternatives
  }
- { id: particle-dake-only, pattern: だけ, meaning: "only, just", tofugu: dake }
- {
    id: particle-shika-nai,
    pattern: しか〜ない,
    meaning: "only, with a negative verb",
    tofugu: dake#vs-
  }
- {
    id: particle-ne-agreement,
    pattern: ね,
    meaning: seeks agreement,
    tofugu: particle-ne
  }
- {
    id: particle-yo-assertion,
    pattern: よ,
    meaning: tells the listener something new,
    tofugu: particle-yo
  }

