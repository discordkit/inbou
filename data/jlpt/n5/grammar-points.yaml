# ── こそあど words ───────────────────────────────────────────────────────────
- {
    id: demonstrative-pronoun,
    pattern: これ／それ／あれ,
    meaning: this one / that one / that one over there,
    tofugu: kore-sore-are-dore
  }
- {
    id: demonstrative-adnominal,
    pattern: この／その／あの,
    meaning: "this / that / that … over there (before a noun)",
    tofugu: kono-sono-ano-dono
  }
- {
    id: demonstrative-place,
    pattern: ここ／そこ／あそこ,
    meaning: here / there / over there,
    tofugu: koko-soko-asoko-doko
  }
- {
    id: demonstrative-direction,
    pattern: こちら／そちら／あちら,
    meaning: "this way / that way (also polite for here and there)",
    tofugu: kochira-sochira-achira-dochira#for-directions-and-places
  }

# ── Adverbs ──────────────────────────────────────────────────────────────────
- {
    id: adverb-mou,
    pattern: もう,
    meaning: "already; with a negative, no longer",
    tofugu: mou-already-not-anymore
  }
- {
    id: adverb-mada,
    pattern: まだ,
    meaning: "still; not yet (with a negative)",
    tofugu: mada
  }
- {
    id: adverb-amari,
    pattern: あまり〜ない,
    meaning: "not very, not much",
    tofugu: amarinai
  }
- { id: adverb-zenzen, pattern: ぜんぜん〜ない, meaning: not at all }
- { id: adverb-yoku, pattern: よく, meaning: often; well }
- { id: adverb-totemo, pattern: とても, meaning: very }
- { id: adverb-sukoshi, pattern: すこし, meaning: a little }
- { id: adverb-chotto, pattern: ちょっと, meaning: a little; a moment }
- {
    id: adverb-takusan,
    pattern: たくさん,
    meaning: a lot,
    tofugu: plural-and-quantity#words-for-unspecified-quantity
  }
- { id: adverb-itsumo, pattern: いつも, meaning: "always, usually" }
- { id: adverb-tokidoki, pattern: ときどき, meaning: sometimes }
- { id: adverb-mata, pattern: また, meaning: again }
- { id: adverb-dandan, pattern: だんだん, meaning: gradually }
- { id: adverb-sugu, pattern: すぐ, meaning: "soon, at once" }
- {
    id: adverb-issho-ni,
    pattern: いっしょに,
    meaning: together,
    tofugu: particle-to#as-in-with
  }
- {
    id: adverb-ichiban,
    pattern: いちばん,
    meaning: the most,
    tofugu: naka#for-out-of
  }

# ── Conjunctions ─────────────────────────────────────────────────────────────
- { id: conjunction-soshite, pattern: そして, meaning: "and, and then" }
- { id: conjunction-sorekara, pattern: それから, meaning: after that }
- {
    id: conjunction-demo,
    pattern: でも,
    meaning: but,
    tofugu: da#in-the-middle-or-beginning-of-a-sentence
  }
- {
    id: conjunction-dakara,
    pattern: だから,
    meaning: "so, therefore",
    tofugu: da#in-the-middle-or-beginning-of-a-sentence
  }
- {
    id: conjunction-ga-but,
    pattern: 〜が、〜,
    meaning: "…, but …",
    tofugu: conjunctive-particle-ga-kedo#and--for-contrast
  }
- {
    id: conjunction-node,
    pattern: 〜ので,
    meaning: "because, so (softer than から)",
