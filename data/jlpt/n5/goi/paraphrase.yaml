- id: n5-g4-0014
  type: paraphrase
  status: draft
  sentence: "この みせは よる 9じに しまります。"
  en: "This shop closes at nine at night."
  answer: "この みせは よる 9じまで あいて います。"
  wrong:
    - option: "この みせは よる 9じから あいて います。"
      why: "から is from: this shop would open at nine at night."
    - option: "この みせは あさ 9じに しまります。"
      why: "あさ is the morning. The shop closes at night."
    - option: "この みせは よる 9じに あきます。"
      why: "あく is to open. しまる is to close."
  difficulty: 3
  note: "This asks for another way to say the shop closes at nine at night: it is open until then, 9じまで あいて います."

- id: n5-g4-0015
  type: paraphrase
  status: draft
  sentence: "ははの おとうとは いしゃです。"
  en: "My mother's younger brother is a doctor."
  answer: "わたしの おじさんは いしゃです。"
  wrong:
    - option: "わたしの おじいさんは いしゃです。"
      why: "おじいさん, with a long い, is a grandfather. Your mother's brother is おじさん."
    - option: "わたしの おばさんは いしゃです。"
      why: "おばさん is an aunt, a woman. ははの おとうと is a man."
    - option: "わたしの おとうとは いしゃです。"
      why: "おとうと is your own younger brother. Your mother's younger brother is your uncle."
  difficulty: 3
  note: "This asks who your mother's younger brother is: your uncle, おじさん."

- id: n5-g4-0016
  type: paraphrase
  status: draft
  sentence: "わたしは きのう がっこうを やすみました。"
  en: "I stayed home from school yesterday."
  answer: "わたしは きのう がっこうへ いきませんでした。"
  wrong:
    - option: "わたしは きのう がっこうへ いきました。"
      why: "This is the opposite: it says you went to school."
    - option: "わたしは きのう がっこうで やすみました。"
      why: "がっこうで やすみました is resting at school, so you were there. がっこうを やすむ is staying away."
    - option: "わたしは きのう がっこうに おそく つきました。"
      why: "This says you were late, but you still went."
  difficulty: 3
  note: "This asks what がっこうを やすむ means: to stay away from school, がっこうへ いかない."
