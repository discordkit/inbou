# 問題4 言い換え類義 — choose the sentence that means about the same as the underlined one.
#
# The sentence and the options are all kana, as on the paper, and the card underlines the whole sentence. The options are whole sentences that differ from each other in one word or phrase, so the student compares meanings, not sentences. Exactly one means the same: each wrong option must change the meaning, never only the tone. Original sentences only: never copy a published one.
#
# A medium or hard question says why each wrong option is wrong (`- option: … why: …`): what the changed word means, and how that changes the sentence. The build fails without them. The note is public at the reveal: the word or phrase that is paraphrased, and what it means.

