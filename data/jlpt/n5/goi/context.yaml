- id: n5-g3-0019
  type: context
  status: draft
  sentence: "ここは としょかんですから、（　） はなして ください。"
  en: "This is a library, so please talk quietly."
  answer: しずかに
  wrong:
    - option: にぎやかに
      why: "にぎやか is lively and noisy: the opposite of what a library wants."
    - option: げんきに
      why: "げんきに is cheerfully. It says nothing about keeping your voice down."
    - option: じょうずに
      why: "じょうずに is skilfully. A library asks for quiet, not skill."
  difficulty: 2
  note: "This asks how to talk in a library: しずかに, quietly."

- id: n5-g3-0020
  type: context
  status: draft
  sentence: "この かみを 3（　） ください。"
  en: "Three sheets of this paper, please."
  answer: まい
  wrong:
    - option: ほん
      why: "ほん counts long, thin things: pencils, bottles."
    - option: こ
      why: "こ counts small round things: apples, eggs."
    - option: さつ
      why: "さつ counts books and notebooks."
  difficulty: 2
  note: "This asks the counter for flat things such as paper: まい. 3まい is read さんまい."

- id: n5-g3-0021
  type: context
  status: draft
  sentence: "あには わたしより 3さい （　）です。"
  en: "My older brother is three years older than me."
  answer: うえ
  wrong:
    - option: した
      why: "した would make him younger. An older brother, あに, is older: うえ."
    - option: まえ
      why: "まえ is in front, or before. Ages are compared with うえ and した."
    - option: あと
      why: "あと is after, for time. Ages are compared with うえ and した."
  difficulty: 3
  note: "This asks how ages compare. An older brother, あに, is older than you: 3さい うえ."

- id: n5-g3-0022
  type: context
  status: draft
  sentence: "わたしの へやは 2かいです。（　）を あがって、みぎの へやです。"
  en: "My room is on the second floor. Go up the stairs; it's the room on the right."
  answer: かいだん
  wrong:
    - option: ろうか
      why: "ろうか is a corridor. It is flat: you walk along it, not up it."
    - option: げんかん
      why: "げんかん is the entrance hall, at the bottom, where you take off your shoes."
    - option: だいどころ
      why: "だいどころ is the kitchen: a room, not a way up."
  difficulty: 3
  note: "This asks how you go up to the second floor: you climb the かいだん, the stairs."

