- id: n5-g3-0024
  type: context
  status: draft
  sentence: "A「ひるごはんは たべましたか。」\nB「いいえ、（　） たべて いません。」"
  en: "A: Have you had lunch? B: No, not yet."
  answer: まだ
  wrong:
    - option: もう
      why: "もう goes with something already done: もう たべました. After いいえ and たべて いません, it is まだ."
    - option: すぐ
      why: "すぐ is right away. It does not go with たべて いません."
    - option: ちょうど
      why: "ちょうど is just or exactly. It does not go with a 'not yet' answer."
  difficulty: 3
  note: "This asks what fits 'No, not yet': まだ. まだ 〜て いません is something that has not happened yet."

- id: n5-g3-0025
  type: context
  status: draft
  sentence: "この くすりは ごはんを たべた （　）に のんで ください。"
  en: "Please take this medicine after you eat."
  answer: あと
  wrong:
    - option: まえ
      why: "まえ takes the plain form: たべる まえに. たべた, the past, goes with あと."
    - option: よこ
      why: "よこ is beside: a place, not a time."
    - option: なか
      why: "なか is inside: a place, not a time."
  difficulty: 3
  note: "This asks when to take the medicine: after eating, たべた あとに."
