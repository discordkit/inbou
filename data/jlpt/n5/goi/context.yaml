  sentence: "あたまが いたいですから、（　）を のみました。"
  en: "I had a headache, so I took some medicine."
  answer: くすり
  wrong: [パン, ほん, くつ]
  difficulty: 1
  note: "This asks what you take for a headache: くすり, medicine. のむ is the verb for medicine, as for drinks."

