- id: n5-g3-0014
  type: context
  status: draft
  sentence: "この カレーは とても （　）ですから、こどもは たべません。"
  en: "This curry is very hot, so the children won't eat it."
  answer: からい
  wrong:
    - option: あまい
      why: "あまい is sweet. Children like sweet food, so it would not stop them."
    - option: やすい
      why: "やすい is cheap. A low price is no reason for children not to eat it."
    - option: あたらしい
      why: "あたらしい is new. Being new is no reason for children not to eat it."
  difficulty: 2
