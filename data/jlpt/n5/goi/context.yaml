- id: n5-g3-0018
  type: context
  status: draft
  sentence: "この もんだいは （　）ですから、すぐ こたえが わかりました。"
  en: "This question was easy, so I knew the answer at once."
  answer: やさしい
  wrong:
    - option: むずかしい
      why: "むずかしい is difficult. A difficult question is not answered at once."
    - option: ながい
      why: "ながい is long. A long question takes longer, not less time."
    - option: おもい
      why: "おもい is heavy. A question has no weight."
  difficulty: 2
