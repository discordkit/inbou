    - option: にじゅっか
      why: "There is no にじゅっか. The 20th has its own reading, はつか, like ついたち for the 1st."
  difficulty: 3
  note: "This asks the reading of 二十日, the 20th of the month. Like ついたち and ふつか, it has its own reading: はつか."

