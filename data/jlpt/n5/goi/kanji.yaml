  word: 七日
  sentence: "らいげつの __七日__は にちようびです。"
  en: "The 7th of next month is a Sunday."
  answer: なのか
  wrong:
    - option: ななか
      why: "七 is なな when you count, but the 7th of the month is なのか."
    - option: しちか
      why: "しち is a counting sound too, but the 7th of the month is なのか."
    - option: なのにち
      why: "The 7th has its own reading, なのか, ending in か."
  difficulty: 3
  note: "This asks the reading of 七日, the 7th of the month: なのか."

- id: n5-g1-0041
  type: kanji
  status: draft
  word: 下手
  sentence: "わたしは うたが __下手__です。"
  en: "I am bad at singing."
  answer: へた
  wrong:
    - option: へだ
      why: "へた has no dakuten."
    - option: げて
      why: "げ and て are sounds of these kanji in other words, but this word is read as one: へた."
    - option: じょうず
      why: "じょうず is the opposite: good at something."
  difficulty: 3
  note: "This asks the reading of 下手, bad at something. It is read as one word: へた."

- id: n5-g1-0042
  type: kanji
  status: draft
  word: 今日
  sentence: "__今日__は なにを しますか。"
  en: "What are you doing today?"
  answer: きょう
  wrong:
    - option: いまひ
      why: "いま and ひ are each kanji's sound on its own, but this word is read as one: きょう."
    - option: きょお
      why: "The long お in きょう is written with う."
    - option: こんび
      why: "This word is read as one, not one kanji at a time: きょう."
  difficulty: 3
  note: "This asks the reading of 今日, today. It is read as one word: きょう."
