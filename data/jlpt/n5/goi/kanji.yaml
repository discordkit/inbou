  sentence: "らいげつの __二十日__に ともだちが きます。"
  en: "A friend is coming on the 20th of next month."
  answer: はつか
  wrong:
    - option: ふつか
      why: "ふつか is 二日, the 2nd. 二十日, the 20th, is はつか."
    - option: はっか
