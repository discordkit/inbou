- id: n5-g1-0003
  type: kanji
  status: reviewed
  word: 今週
  sentence: "__今週__は しごとが いそがしいです。"
  en: "I am busy with work this week."
  answer: こんしゅう
  wrong:
    - option: こんしゅ
      why: "週 has a long vowel: しゅう. こんしゅ drops the う."
    - option: こんじゅう
      why: "週 is しゅう, with no dakuten. じゅう is how 十 sounds."
    - option: いましゅう
      why: "今 is いま on its own, but こん in words like 今週 and 今月."
  difficulty: 2
  note: "This asks the reading of 今週, this week. 今 is こん here, and 週 is a long しゅう."

- id: n5-g1-0004
  type: kanji
  status: reviewed
  word: 先月
  sentence: "__先月__ にほんへ きました。"
  en: "I came to Japan last month."
  answer: せんげつ
  wrong:
    - option: せんがつ
      why: "月 is がつ only in the names of the months, like 四がつ. In 先月, 今月 and 来月 it is げつ."
    - option: せんつき
      why: "つき is 月 on its own: the moon. In 先月 it is げつ."
    - option: さきげつ
      why: "先 is さき on its own (ahead), but せん in 先月 and 先週."
  difficulty: 2
  note: "This asks the reading of 先月, last month. In month words like this, 月 is げつ."

- id: n5-g1-0005
  type: kanji
  status: reviewed
  word: 時計
  sentence: "この __時計__は ちちに もらいました。"
  en: "I got this watch from my father."
  answer: とけい
  wrong:
    - option: どけい
      why: "On its own, 時計 is とけい. It becomes どけい only after another word, as in うでどけい (a wristwatch)."
    - option: じけい
      why: "時 is じ in 時間 and 三時, but 時計 has a reading of its own: とけい."
    - option: ときけい
      why: "時 is とき on its own (time), but 時計 is read とけい."
  difficulty: 3
  note: "This asks the reading of 時計, a clock or watch. The word has its own reading, とけい, which its kanji do not suggest."

