# 問題1 漢字読み — read the underlined word, written in kanji, and choose its reading in hiragana.
#
# The sentence is all kana except the underlined word, `__like this__`, and nothing carries a reading: the reading is the question. `word` is the word's dictionary form as JMdict spells it. The build checks it against the N5 word list, and a test never asks the same word in 問題1 and 問題2. Original sentences only: never copy a published one.
#
# Distractors come in two kinds, as on the paper. Near-miss readings, wrong by one sound: a long or short vowel, a dakuten, a small っ, or a kanji's reading from another word. Or other words of the same kind (another colour, another direction). Never use another real reading of the same kanji word: that option would be right somewhere, and the build fails on it.
#
# A medium or hard question says why each wrong option is wrong (`- option: … why: …`), because the rule behind a near miss may be new to the student; the build fails without them. Whys are sent privately to the student who chose that option. The note is public at the reveal: what the question asks, and its trap.

- id: n5-g1-0001
  type: kanji
  status: reviewed
  word: 白い
  sentence: "つくえの うえに __白い__ ノートが あります。"
  en: "There is a white notebook on the desk."
  answer: しろい
  wrong: [くろい, あかい, あおい]
  difficulty: 1
  note: "This asks the reading of 白い, white. くろい is 黒い (black), あかい 赤い (red) and あおい 青い (blue)."

