# 問題2 表記 — the underlined word is in kana; choose how it is written, in kanji or katakana.
#
# The sentence is all kana, and the underlined word, `__like this__`, is the word to spell. `word` is the word's dictionary form as JMdict spells it. The build checks it against the N5 word list, and a test never asks the same word in 問題1 and 問題2. Original sentences only: never copy a published one.
#
# Distractors are look-alikes, as on the paper: a kanji with a similar shape (休 and 体, 名 and 各), the wrong okurigana, or katakana that differ by a stroke or a dakuten (ン and ソ, ボ and ポ). They need not be N5 kanji, because the student only has to reject them. Never use a real word with the same reading (はし: 橋 and 箸): that option would be right somewhere, and the build fails on it.
#
# A medium or hard question says why each wrong option is wrong (`- option: … why: …`): what the look-alike really is, so the student can tell the two apart next time. The build fails without them. The note is public at the reveal.

- id: n5-g2-0001
  type: spelling
  status: reviewed
  word: 水
  sentence: "すみません、__みず__を ください。"
  en: "Excuse me, may I have some water?"
  answer: 水
  wrong: [氷, 木, 火]
  difficulty: 1
  note: "This asks how みず is written: 水. 氷 is こおり (ice), 木 is き (a tree) and 火 is ひ (fire)."

