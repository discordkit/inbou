      why: "左 is ひだり, the other side. 右 has 口 at the bottom; 左 has 工."
    - option: 石
      why: "石 is いし, a stone."
    - option: 名
      why: "名 is the な of なまえ (a name)."
  difficulty: 2
  note: "This asks how みぎ is written: 右. Its partner 左 (ひだり) differs only at the bottom."

- id: n5-g2-0003
