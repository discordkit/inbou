- id: n5-g2-0017
  type: spelling
  status: draft
  word: 午後
  sentence: "__ごご__ さんじに えきで あいましょう。"
  en: "Let's meet at the station at three in the afternoon."
  answer: 午後
  wrong:
    - option: 牛後
      why: "牛 is a cow: its middle line goes through the top. In 午 it does not."
    - option: 午役
      why: "役 is a role, read やく. 後 has 幺 and 夂 on the right."
    - option: 牛役
      why: "Neither kanji is right: ごご is 午, with no line through the top, and 後."
  difficulty: 3
  note: "This asks how ごご, the afternoon, is written: 午後. 午 is noon, and 後 after."

- id: n5-g2-0018
  type: spelling
  status: draft
  word: 話す
  sentence: "ともだちと にほんごで __はなします__。"
  en: "I talk with my friends in Japanese."
  answer: 話します
  wrong:
    - option: 語します
      why: "語 is the ご of にほんご, a language. 話 has 舌, the tongue, on the right."
    - option: 詰します
      why: "詰 means to pack. 話 has 舌 on the right, not 吉."
    - option: 話なします
      why: "話 already says はな, so only します follows: 話します."
  difficulty: 3
  note: "This asks how はなします is written: 話します, with 舌, the tongue, on the right."

