    - option: デレビ
      why: "て has no dakuten: テ. デ is で."
    - option: テレヒ
      why: "び has a dakuten: ビ. ヒ is ひ."
  difficulty: 2
  note: "This asks how てれび is written. Words from other languages are written in katakana: テレビ."

