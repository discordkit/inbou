- id: n5-g2-0011
  type: spelling
  status: draft
  word: 目
  sentence: "__め__が あかいですね。"
  en: "Your eyes are red."
  answer: 目
  wrong:
    - option: 自
      why: "自 is the じ of じぶん (yourself): 目 with a short stroke on top."
    - option: 日
      why: "日 is the sun or a day: one line inside, not two."
    - option: 月
      why: "月 is the moon or a month: its left side is a long curve."
  difficulty: 2
  note: "This asks how め, an eye, is written: 目, a box with two lines inside."

