      difficulty: 3
      points: [form-n-desu]
      note: "んです follows the plain form: いたい んです. It explains a situation someone asked about."

- id: n5-b1-0042
  type: form
  status: reviewed
  sentence: |-
    Ａ「なつやすみは（1）からですか。」
    Ｂ「{七月|しちがつ} {二十日|はつか}からです。」
