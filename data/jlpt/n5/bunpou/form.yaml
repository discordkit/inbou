  en: I want a new car.
  slots:
    - answer: ほしいです
      wrong: [あげます, もらいます, ください]
      difficulty: 2
      points: [form-hoshii]
      note: "Nが ほしいです: want something. ほしい takes が for the thing you want."

- id: n5-b1-0135
  type: form
  status: draft
  sentence: "しゅくだいを して（1）、テレビを {見|み}ます。"
  en: I watch TV after I do my homework.
  slots:
    - answer: から
      wrong: [まで, ので, より]
      difficulty: 2
      points: [form-te-kara]
      note: "〜てから: after doing …. から follows the て form: して から."

- id: n5-b1-0136
  type: form
  status: draft
  sentence: "{夏休|なつやす}みは {国|くに}へ {帰|かえ}る（1）です。"
  en: I plan to go back to my country in the summer holidays.
  slots:
    - answer: つもり
      wrong: [ほう, あと, ながら]
      difficulty: 2
      points: [form-tsumori]
      note: "〜つもりです: intend to. It follows the dictionary form: {帰|かえ}る つもりです."

- id: n5-b1-0137
  type: form
  status: draft
  sentence: "かぜの ときは、{早|はや}く（1） ほうが いいですよ。"
  en: When you have a cold, you had better go to bed early.
  slots:
    - answer: ねた
      wrong: [ねて, ねない, ねます]
      difficulty: 3
      points: [form-hou-ga-ii]
      note: "〜た ほうが いい: had better. It takes the た form: ねた ほうが いいです. ねない would give the opposite advice."

- id: n5-b1-0138
  type: form
  status: draft
  sentence: "{兄|あに}は {医者|いしゃ}（1）、{姉|あね}は {先生|せんせい}です。"
  en: My older brother is a doctor, and my older sister is a teacher.
  slots:
    - answer: で
      wrong: [と, に, が]
      difficulty: 3
      points: [form-te-link]
      note: "A noun joins the next sentence with で: {医者|いしゃ}で、…. It works like です, and."

- id: n5-b1-0139
  type: form
  status: draft
  sentence: "{弟|おとうと}は {歌|うた}を {歌|うた}う（1） {好|す}きです。"
  en: My younger brother likes singing.
  slots:
    - answer: のが
      wrong: [のを, のに, ので]
      difficulty: 2
      points: [form-no-ga-suki]
      note: "の turns {歌|うた}を {歌|うた}う into a thing you like, and {好|す}き takes が: {歌|うた}うのが {好|す}きです."

- id: n5-b1-0140
  type: form
  status: draft
  sentence: "にわに {犬|いぬ}が（1）。"
  en: There is a dog in the garden.
  slots:
    - answer: います
      wrong: [あります, です, します]
      difficulty: 1
      points: [form-ga-aru-iru]
      note: "Animals and people take いる: {犬|いぬ}が います. Things take ある."

- id: n5-b1-0141
  type: form
  status: draft
  sentence: "これは {母|はは}が（1） セーターです。"
  en: This is a sweater my mother made.
  slots:
    - answer: "{作|つく}った"
      wrong: ["{作|つく}って", "{作|つく}ります", "{作|つく}りましょう"]
      difficulty: 3
      points: [clause-noun-modifier]
      note: "A verb before a noun takes the plain form: {母|はは}が {作|つく}った セーター, the sweater my mother made. ます forms do not go before a noun."

- id: n5-b1-0142
  type: form
  status: draft
  sentence: "{友|とも}だちに {本|ほん}を（1）ました。でも、まだ かえして いません。"
  en: I borrowed a book from a friend. But I haven't returned it yet.
  slots:
    - answer: "{借|か}り"
      wrong: ["{貸|か}し", あげ, もらい]
      difficulty: 3
      points: [verb-kariru-kasu]
      note: "Nに {借|か}りる: borrow from someone. The writer still has to give it back, so it was borrowed, not lent or given."

- id: n5-b1-0143
  type: form
  status: draft
  sentence: "この {漢字|かんじ}の {読|よ}み（1）が わかりません。"
  en: I don't know how to read this kanji.
  slots:
    - answer: かた
      wrong: [こと, ほう, とき]
      difficulty: 2
      points: [form-kata]
      note: "ます stem ＋ かた: the way of doing something. {読|よ}みかた, how to read it."

- id: n5-b1-0144
  type: form
  status: draft
  sentence: "{教室|きょうしつ}で {食|た}べ（1） いけません。"
  en: You must not eat in the classroom.
  slots:
    - answer: ては
      wrong: [ても, てから, ないで]
      difficulty: 3
      points: [form-te-wa-ikenai]
      note: "〜ては いけません forbids something: {食|た}べては いけません, you must not eat."

- id: n5-b1-0145
  type: form
  status: draft
  sentence: "きょうは あまり（1）。"
  en: It is not very cold today.
  slots:
    - answer: さむく ありません
      wrong: [さむいです, さむかったです, さむくて]
      difficulty: 2
      points: [adverb-amari, form-adjective-negative]
      note: "あまり needs a negative: あまり さむく ありません, not very cold."

- id: n5-b1-0146
  type: form
  status: draft
  sentence: "あの（1） {建物|たてもの}は {銀行|ぎんこう}です。"
  en: That tall building is a bank.
  slots:
    - answer: "{高|たか}い"
      wrong: ["{高|たか}く", "{高|たか}くて", "{高|たか}かった"]
      difficulty: 1
      points: [form-adjective-before-noun]
      note: "An い adjective goes straight before its noun: {高|たか}い {建物|たてもの}."

- id: n5-b1-0147
  type: form
  status: draft
  sentence: "{子|こ}どもの（1）、よく この {川|かわ}で あそびました。"
  en: When I was a child, I often played in this river.
  slots:
    - answer: とき
      wrong: [まえ, あと, ながら]
      difficulty: 2
      points: [form-toki]
      note: "Nの とき: when … was. とき takes の after a noun: {子|こ}どもの とき."

- id: n5-b1-0148
  type: form
  status: draft
  sentence: |-
    Ａ「{肉|にく}と {魚|さかな}と、どちらが {好|す}きですか。」
    Ｂ「{魚|さかな}の（1）が {好|す}きです。」
  en: "A: Which do you like better, meat or fish? B: I like fish better."
  slots:
    - answer: ほう
      wrong: [もの, とき, まえ]
      difficulty: 2
      points: [comparison-no-hou-ga]
      note: "Aの ほうが: A is the one. It answers どちら, which of two."

- id: n5-b1-0149
  type: form
  status: draft
  sentence: |-
    （{朝|あさ}、{家|いえ}で）
    {子|こ}ども「（1）。」
    {母|はは}「いってらっしゃい。」
  en: "(In the morning, at home) Child: I'm off. Mother: Have a good day."
  slots:
    - answer: いってきます
      wrong: [ただいま, おかえりなさい, いただきます]
      difficulty: 1
      points: [phrase-greetings]
      note: "いってきます is said when you leave home. Whoever stays answers いってらっしゃい."

- id: n5-b1-0150
  type: form
  status: draft
  sentence: |-
    （{夜|よる}、{家|いえ}で）
    {子|こ}ども「ただいま。」
    {母|はは}「（1）。」
  en: "(In the evening, at home) Child: I'm home. Mother: Welcome back."
  slots:
    - answer: おかえりなさい
      wrong: [いってらっしゃい, いってきます, ごちそうさまでした]
      difficulty: 1
      points: [phrase-greetings]
      note: "ただいま is said when you come home, and the answer is おかえりなさい."

- id: n5-b1-0151
  type: form
  status: draft
  sentence: "あした、{学校|がっこう}（1） パーティーが あります。"
  en: There is a party at school tomorrow.
  slots:
    - answer: で
      wrong: [に, を, へ]
      difficulty: 3
      points: [particle-de-place]
      note: "An event takes で for where it happens: {学校|がっこう}で パーティーが あります. Things that are somewhere take に."

- id: n5-b1-0152
  type: form
  status: draft
  sentence: "きょうは {日曜日|にちようび}（1）、{学校|がっこう}は {休|やす}みです。"
  en: Today is Sunday, so there is no school.
  slots:
    - answer: なので
      wrong: [ので, を, と]
      difficulty: 3
      points: [conjunction-node]
      note: "After a noun, ので needs な: {日曜日|にちようび}なので."

- id: n5-b1-0153
  type: form
  status: draft
  sentence: |-
    Ａ「{学校|がっこう}まで（1） {来|き}ますか。」
    Ｂ「{自転車|じてんしゃ}で {来|き}ます。」
  en: "A: How do you get to school? B: By bicycle."
  slots:
    - answer: "{何|なに}で"
      wrong: [どうして, どこで, いつ]
      difficulty: 3
      points: [question-nani]
      note: "{何|なに}で asks the means: by what? B answers {自転車|じてんしゃ}で, by bicycle."

- id: n5-b1-0154
  type: form
  status: draft
  sentence: "わたしは {東京|とうきょう}（1） {住|す}んで います。"
  en: I live in Tokyo.
  slots:
    - answer: に
      wrong: [で, を, へ]
      difficulty: 3
      points: [particle-ni-existence]
      note: "{住|す}む takes に for where you live: {東京|とうきょう}に {住|す}んで います. で is a common mistake."

- id: n5-b1-0155
  type: form
  status: draft
  sentence: "つぎの {駅|えき}で {電車|でんしゃ}（1） おります。"
  en: I get off the train at the next station.
  slots:
    - answer: を
      wrong: [に, で, が]
      difficulty: 3
      points: [particle-o-through]
      note: "おりる takes を for what you get off: {電車|でんしゃ}を おります. のる takes に."
