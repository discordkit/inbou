- id: n5-b1-0088
  type: form
  status: draft
  sentence: |-
    Ａ「のみものは {何|なに}が いいですか。」
    Ｂ「わたしは コーヒー（1） します。」
  en: "A: What would you like to drink? B: I'll have coffee."
  slots:
    - answer: に
      wrong: [を, が, で]
      difficulty: 3
      points: [phrase-ni-suru]
      note: "〜に します: choose, I'll have. に marks the thing chosen: コーヒーに します. コーヒーを します is not Japanese."

- id: n5-b1-0089
  type: form
  status: draft
  sentence: |-
    Ａ「{毎日|まいにち}（1） {勉強|べんきょう}しますか。」
    Ｂ「{二時間|にじかん}ぐらい {勉強|べんきょう}します。」
  en: "A: How many hours do you study every day? B: About two hours."
  slots:
    - answer: "{何時間|なんじかん}"
      wrong: ["{何時|なんじ}", いつ, "{何回|なんかい}"]
      difficulty: 3
      points: [question-nani]
      note: "{何時間|なんじかん} asks how long, and B answers {二時間|にじかん}. {何時|なんじ} asks what time."

- id: n5-b1-0090
  type: form
  status: draft
  sentence: "きのうは どこへも {行|い}き（1）。"
  en: I didn't go anywhere yesterday.
  slots:
    - answer: ませんでした
      wrong: [ました, ません, ましょう]
      difficulty: 2
      points: [form-polite-tense, question-mo-negative]
      note: "どこへも needs a negative, and きのう needs the past: ませんでした."

- id: n5-b1-0091
  type: form
  status: draft
  sentence: "ここは（1） こうえんです。"
  en: This is a quiet park.
  slots:
    - answer: しずかな
      wrong: [しずか, しずかの, しずかに]
      difficulty: 2
      points: [form-adjective-before-noun]
      note: "A な adjective keeps な before a noun: しずかな こうえん."

- id: n5-b1-0092
  type: form
  status: draft
  sentence: "きのうは {一日中|いちにちじゅう} うち（1） いました。"
  en: Yesterday I was at home all day.
  slots:
    - answer: に
      wrong: [で, を, へ]
      difficulty: 2
      points: [particle-ni-existence]
      note: "いる takes に for where someone is: うちに いました. で marks where an action happens."

- id: n5-b1-0093
  type: form
  status: draft
  sentence: "{駅|えき}で {友|とも}だち（1） {会|あ}いました。"
  en: I met a friend at the station.
  slots:
    - answer: に
      wrong: [を, で, へ]
      difficulty: 2
      points: [particle-ni-recipient]
      note: "{会|あ}う takes に for the person you meet: {友|とも}だちに {会|あ}いました. {友|とも}だちを {会|あ}う is a common mistake."

- id: n5-b1-0094
  type: form
  status: draft
  sentence: "{日本語|にほんご}の {勉強|べんきょう}が だんだん（1） なりました。"
  en: Studying Japanese gradually became interesting.
