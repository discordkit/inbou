      difficulty: 3
      points: [form-mashou-ka]
      note: "〜ましょうか offers to do something for someone. 〜ませんか invites them to do something with you."

- id: n5-b1-0041
  type: form
  status: reviewed
  sentence: |-
    Ａ「どうしたんですか。」
    Ｂ「あたまが（1）んです。」
  en: "A: What's wrong? B: I have a headache."
