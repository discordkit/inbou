    - answer: どちら
      wrong: [どれ, どこ, なに, だれ]
      difficulty: 2
      points: [question-dochira, comparison-no-hou-ga]
      note: "Between two things, ask どちら. どれ asks about three or more."

- id: n5-b1-0032
  type: form
  status: reviewed
  sentence: "くだものの {中|なか}で（1） りんごが {好|す}きです。"
  en: Of all fruits, I like apples best.
  slots:
    - answer: いちばん
      wrong: [とても, もっと, よく, たくさん]
      difficulty: 2
      points: [comparison-ichiban]
      note: "〜の {中|なか}で いちばん picks the top one of a group."

- id: n5-b1-0033
  type: form
  status: reviewed
  sentence: |-
    Ａ「しゅくだいは {終|お}わりましたか。」
    Ｂ「はい、（1） {終|お}わりました。」
  en: "A: Have you finished your homework? B: Yes, I've already finished."
  slots:
    - answer: もう
      wrong: [まだ, あまり, ぜんぜん, これから]
      difficulty: 1
      points: [adverb-mou]
      note: "もう with a past verb means already. まだ goes with a negative: まだ {終|お}わって いません."

- id: n5-b1-0034
  type: form
  status: reviewed
  sentence: "ばんごはんを（1） あとで、さんぽを します。"
  en: I take a walk after eating dinner.
  slots:
    - answer: "{食|た}べた"
      wrong: ["{食|た}べる", "{食|た}べて", "{食|た}べ", "{食|た}べない"]
      difficulty: 2
      points: [form-ta-ato-de]
      note: "あとで follows the た form: {食|た}べた あとで. まえに follows the dictionary form: {食|た}べる まえに."

- id: n5-b1-0035
  type: form
  status: reviewed
  sentence: "{今|いま}、{弟|おとうと}は へやで {音楽|おんがく}を（1）。"
  en: My younger brother is listening to music in his room now.
