      difficulty: 1
      points: [form-te-kudasai]
      note: "〜て ください asks someone to do something: {話|はな}して ください."

- id: n5-b1-0025
  type: form
  status: reviewed
  sentence: |-
    Ａ「しゅくだいは もう {出|だ}しましたか。」
    Ｂ「いいえ、まだ（1）。」
  en: "A: Have you handed in your homework already? B: No, not yet."
