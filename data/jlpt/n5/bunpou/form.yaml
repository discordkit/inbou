      wrong: [どこかへ, どこへ, どこが]
      difficulty: 3
      points: [question-mo-negative]
      note: "A question word with も and a negative means none: どこへも {行|い}きません, nowhere. どこかへ, somewhere, belongs in the question."

- id: n5-b1-0027
  type: form
  status: reviewed
  sentence: "{一週間|いっしゅうかん}（1） {三回|さんかい} プールで およぎます。"
  en: I swim in the pool three times a week.
  slots:
    - answer: に
      wrong: [を, が, と, の]
      difficulty: 2
      points: [particle-ni-frequency]
      note: "に after a span of time counts how often: {一週間|いっしゅうかん}に {三回|さんかい}, three times a week."

- id: n5-b1-0028
  type: form
  status: reviewed
  sentence: "{毎朝|まいあさ} パン（1） ごはんを {食|た}べます。"
  en: Every morning I eat bread or rice.
  slots:
    - answer: か
      wrong: [が, を, に, で]
      difficulty: 2
      points: [particle-ka-or]
      note: "か between two nouns means or: パンか ごはん, one of the two."

- id: n5-b1-0029
  type: form
  status: reviewed
  sentence: "{教室|きょうしつ}に {学生|がくせい}が {一人|ひとり}（1） います。"
  en: There is only one student in the classroom.
  slots:
    - answer: だけ
      wrong: [しか, も, が, を]
      difficulty: 3
      points: [particle-dake-only]
      note: "だけ, only, goes with a positive verb: {一人|ひとり}だけ います. しか means the same but needs a negative: {一人|ひとり}しか いません."

- id: n5-b1-0030
  type: form
  status: reviewed
  sentence: |-
    Ａ「{田中|たなか}さんは（1） {人|ひと}ですか。」
    Ｂ「おもしろくて、やさしい {人|ひと}です。」
  en: "A: What kind of person is Tanaka-san? B: A funny, kind person."
  slots:
    - answer: どんな
      wrong: [どう, どれ, だれ, いつ]
      difficulty: 1
      points: [question-donna]
      note: "どんな comes before a noun and asks what kind: どんな {人|ひと}. どう stands alone: どうですか."

- id: n5-b1-0031
  type: form
  status: reviewed
  sentence: |-
    Ａ「バスと {電車|でんしゃ}と、（1）が はやいですか。」
