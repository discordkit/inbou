      note: "〜て います says what is going on right now; {今|いま} is the clue. The others ask, invite or suggest, which does not fit a sentence about {弟|おとうと}."

- id: n5-b1-0036
  type: form
  status: reviewed
  sentence: "ここは びょういんです。たばこを（1）。"
  en: This is a hospital. You must not smoke.
  slots:
    - answer: すっては いけません
      wrong: [すっても いいです, すって ください, すいましょう]
      difficulty: 3
      points: [form-te-wa-ikenai]
      note: "〜ては いけません forbids something. In a hospital, smoking is forbidden, not allowed or invited."

- id: n5-b1-0037
  type: form
  status: reviewed
  sentence: "{日曜日|にちようび}は {本|ほん}を {読|よ}んだり、{音楽|おんがく}を（1） します。"
