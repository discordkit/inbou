# 問題3 文章の文法 — a short passage with numbered blanks.
#
# Blanks are （n）, numbered in the order a reader meets them. A passage has about eight, and a test asks any four of them and shows the rest filled in, so a passage that comes up again asks a different set. Because any blank may be shown filled, each must stand alone: no two test the same grammar point, no two sit side by side (the build checks both), and no filled-in answer gives another away.
#
# Each blank's wrong options must be wrong in the PASSAGE, not just the sentence: the paper tests whether a form fits the flow — a conjunction that fits the sentence before, a tense that fits the day.

- id: n5-b3-0001
  type: passage
  status: reviewed
  intro: "リーさんは「{私|わたし}の しゅうまつ」の さくぶんを {書|か}いて、クラスの みんなの {前|まえ}で {読|よ}みます。"
  text: |-
    {私|わたし}は {毎週|まいしゅう} {土曜日|どようび}（1） {友|とも}だちと テニスを します。（2）、{先週|せんしゅう}の {土曜日|どようび}は {雨|あめ}（3）。{私|わたし}たちは テニスを しないで、{駅|えき}の {近|ちか}くの きっさてん（4） {行|い}きました。コーヒーを（5）、たくさん {話|はな}しました。きっさてん（6） ケーキも とても おいしかったです。{今度|こんど}は {家族|かぞく}（7） {行|い}きたいです。{来週|らいしゅう}は {天気|てんき}が いいでしょう。また テニスが（8）。
  en: "Every Saturday I play tennis with my friends. But last Saturday it rained. We didn't play tennis, and went to a café near the station. We talked a lot while drinking coffee. The café's cake was very good too. Next time I want to go with my family. Next week the weather will probably be good, so we can play tennis again."
  blanks:
    - answer: に
      wrong: [で, を, が]
      difficulty: 1
      points: [particle-ni-time]
      note: "に marks a day or a time: {土曜日|どようび}に."
    - answer: でも
      wrong: [だから, それから, そして]
      difficulty: 1
      points: [conjunction-demo]
      note: "でも turns to something unexpected: tennis every Saturday, but last Saturday it rained."
    - answer: でした
      wrong: [です, でしょう, じゃ ありません]
      difficulty: 1
      points: [form-adjective-past]
      note: "{先週|せんしゅう} puts it in the past: {雨|あめ}でした. It rained, so they did not play tennis."
    - answer: へ
      wrong: [を, で, が]
      difficulty: 1
      points: [particle-he-direction]
      note: "へ marks the direction you go: きっさてんへ {行|い}きました. に would also be right, so it is not offered."
    - answer: "{飲|の}みながら"
      wrong: ["{飲|の}みたいから", "{飲|の}みに", "{飲|の}みませんか"]
      difficulty: 2
      points: [form-nagara]
      note: "〜ながら: two things at once. They talked while they drank coffee."
    - answer: の
      wrong: [を, に, へ]
      difficulty: 1
      points: [particle-no-possessive]
      note: "の links two nouns: きっさてんの ケーキ, the café's cake."
    - answer: と
      wrong: [を, に, の]
      difficulty: 1
      points: [particle-to-with]
      note: "と marks who you go with: {家族|かぞく}と {行|い}く. ({家族|かぞく}で {行|い}く, as a family, is natural too.)"
    - answer: できます
      wrong: [できました, できません, できませんでした]
      difficulty: 2
      points: [form-polite-tense]
      note: "Next week is still to come, and good weather means tennis: できます."

- id: n5-b3-0002
  type: passage
  status: reviewed
  intro: "アンナさんが「{日本|にほん}の コンビニ」の さくぶんを {書|か}きました。"
  text: |-
    {日本|にほん}の コンビニは（1） べんりです。{朝|あさ}（2） {夜|よる}まで あいて います。{食|た}べもの（3） {飲|の}みものが たくさん あります。{私|わたし}は {毎日|まいにち} {学校|がっこう}の {帰|かえ}りに コンビニへ おべんとうを（4） {行|い}きます。
    {私|わたし}の {国|くに}には コンビニが（5）から、{日本|にほん}に {来|き}て はじめて コンビニ（6） {入|はい}りました。はじめは つかいかた（7） わかりませんでした。（8）、{今|いま}は コンビニが だいすきです。
  en: "Convenience stores in Japan are very handy. They are open from morning until night, and they have lots of food, drinks and more. Every day on my way home from school, I go to one to buy a bento. There are no convenience stores in my country, so I first went into one after I came to Japan. At first I did not know how to use it. But now I love convenience stores."
  blanks:
    - answer: とても
      wrong: [たくさん, ぜんぜん, あまり]
      difficulty: 1
      points: [adverb-totemo]
      note: "とても makes べんり stronger. ぜんぜん and あまり need a negative, and たくさん counts things."
    - answer: から
      wrong: [まで, で, に]
      difficulty: 1
      points: [particle-kara-made]
      note: "から marks the start and まで the end: {朝|あさ}から {夜|よる}まで."
    - answer: や
      wrong: [を, に, の]
      difficulty: 1
      points: [particle-ya-and]
      note: "や lists some items out of many: {食|た}べものや {飲|の}みもの, and more."
    - answer: "{買|か}いに"
      wrong: ["{買|か}う", "{買|か}った", "{買|か}わない"]
      difficulty: 2
      points: [form-ni-iku]
      note: "〜に {行|い}く: go to do something. It takes the ます stem: {買|か}いに {行|い}きます."
    - answer: ありません
      wrong: [あります, いません, ありました]
      difficulty: 2
      points: [form-ga-aru-iru]
      note: "から gives the reason she first went into one in Japan: there are none at home, ありません. Things take ある; people and animals take いる."
    - answer: に
      wrong: [を, で, が]
      difficulty: 2
      points: [particle-ni-destination]
      note: "{入|はい}る takes に for the place you go into: コンビニに {入|はい}りました."
    - answer: が
      wrong: [を, に, で]
      difficulty: 2
      points: [particle-ga-object]
      note: "わかる takes が for what you understand: つかいかたが わかりません. を is a common mistake."
    - answer: でも
      wrong: [だから, そして, いつも]
      difficulty: 1
      points: [conjunction-demo]
      note: "でも turns to the opposite: at first she could not use one, but now she loves them."

- id: n5-b3-0003
  type: passage
  status: reviewed
  intro: "ケンさんが {先生|せんせい}に メールを {書|か}きました。"
  text: |-
    {田中|たなか}{先生|せんせい}
    こんにちは。ケンです。{来週|らいしゅう}（1） {月曜日|げつようび}、{学校|がっこう}を（2）。{国|くに}から {母|はは}（3） {来|く}る（4）、くうこうへ むかえ（5） {行|い}きます。{火曜日|かようび}には {学校|がっこう}（6） {来|き}ます。じゅぎょうの ノートは {友|とも}だちに（7） {読|よ}みます。しゅくだいは {火曜日|かようび}に {出|だ}しても（8）か。
    よろしく おねがいします。
    ケン
  en: "Dear Tanaka-sensei, Hello, this is Ken. I will be absent from school next Monday. My mother is coming from my country, so I am going to the airport to meet her. I will come to school on Tuesday. I will borrow the class notes from a friend and read them. May I hand in my homework on Tuesday? Thank you. Ken"
  blanks:
    - answer: の
      wrong: [に, で, が]
      difficulty: 1
      points: [particle-no-possessive]
      note: "の joins two nouns: {来週|らいしゅう}の {月曜日|げつようび}, Monday next week."
    - answer: "{休|やす}みます"
      wrong:
        ["{休|やす}みました", "{休|やす}んで います", "{休|やす}みたかったです"]
      difficulty: 2
      points: [form-polite-tense]
      note: "Next Monday is still to come: {休|やす}みます, not a past form."
    - answer: が
      wrong: [を, に, で]
      difficulty: 2
      points: [particle-ga-subject]
      note: "が marks who does the action inside the clause: {母|はは}が {来|く}る, my mother comes."
    - answer: ので
      wrong: [けど, まで, が]
      difficulty: 2
      points: [conjunction-node]
      note: "〜ので gives a reason, like から: his mother is coming, so he goes to meet her."
    - answer: に
      wrong: [で, を, と]
      difficulty: 2
      points: [form-ni-iku]
      note: "〜に {行|い}く: go to do something. むかえ is the ます stem of むかえる, to meet someone: むかえに {行|い}きます."
    - answer: に
      wrong: [を, で, が]
      difficulty: 1
      points: [particle-ni-destination]
      note: "{来|く}る takes に for where someone arrives: {学校|がっこう}に {来|き}ます."
    - answer: かりて
      wrong: [かして, かりに, かります]
      difficulty: 3
      points: [verb-kariru-kasu]
      note: "{友|とも}だちに かりる: borrow from a friend. かす, to lend, goes the other way."
    - answer: いいです
      wrong: [いけません, ください, なりません]
      difficulty: 2
      points: [form-te-mo-ii]
      note: "〜ても いいですか asks for permission: may I …?"

- id: n5-b3-0004
  type: passage
  status: reviewed
  intro: "ジョンさんと マリアさんは「わたしの すきな きせつ」の さくぶんを {書|か}いて、クラスの みんなの {前|まえ}で {読|よ}みます。"
  text: |-
    【ジョンさんの さくぶん】
    わたしは なつが すきです。{毎日|まいにち} {海|うみ}（1） およいで、{夜|よる}は {友|とも}だち（2） はなびを {見|み}ます。なつは あついですから、きらいな {人|ひと}（3） います。（4）、わたしは あつい {日|ひ}が だいすきです。
    【マリアさんの さくぶん】
    わたしは ふゆ（5） いちばん すきです。わたしの {国|くに}では ゆきが ふりません。{去年|きょねん}の ふゆ、{日本|にほん}で はじめて ゆきを（6）。とても きれいでした。ことしの ふゆは、{友|とも}だちと {山|やま}へ スキーを（7） {行|い}きたいです。スキーは（8） した ことが ありませんから、とても たのしみです。
  en: "John's composition: I like summer. Every day I swim in the sea, and at night I watch fireworks with friends. Summer is hot, so some people don't like it. But I love hot days. Maria's composition: I like winter best. It doesn't snow in my country. Last winter, in Japan, I saw snow for the first time. It was very beautiful. This winter I want to go to the mountains with friends to ski. I have never skied before, so I'm really looking forward to it."
  blanks:
    - answer: で
      wrong: [に, が, と]
      difficulty: 1
      points: [particle-de-place]
      note: "で marks where an action happens: {海|うみ}で およぐ. に marks where something is, or where it goes."
    - answer: と
      wrong: [に, を, で]
      difficulty: 1
      points: [particle-to-with]
      note: "と marks who you do something with: {友|とも}だちと はなびを {見|み}ます."
    - answer: も
      wrong: [を, に, で]
      difficulty: 2
      points: [particle-mo-also]
      note: "も: also. Many people like summer, but there are also people who dislike it."
    - answer: でも
      wrong: [だから, それから, では]
      difficulty: 1
      points: [conjunction-demo]
      note: "でも turns to the opposite: some people dislike the heat, but John loves it."
    - answer: が
      wrong: [を, に, で]
      difficulty: 2
      points: [particle-ga-object]
      note: "すき takes が for what you like: ふゆが いちばん すきです."
    - answer: "{見|み}ました"
      wrong: ["{見|み}ます", "{見|み}て います", "{見|み}たいです"]
      difficulty: 2
      points: [form-polite-tense]
      note: "{去年|きょねん}の ふゆ puts it in the past: {見|み}ました."
    - answer: しに
      wrong: [して, する, した]
      difficulty: 2
      points: [form-ni-iku]
      note: "〜に {行|い}く: go to do something. It takes the ます stem: スキーを しに {行|い}きます."
    - answer: まだ
      wrong: [もう, よく, いつも]
      difficulty: 2
      points: [adverb-mada, form-ta-koto-ga-aru]
      note: "まだ 〜た ことが ありません: have never done it yet. もう would say she has stopped."

- id: n5-b3-0005
  type: passage
  status: reviewed
  intro: "リンさんは「わたしの {町|まち}」の さくぶんを {書|か}きました。"
  text: |-
    わたしの {町|まち}は {大|おお}きく ありませんが、とても しずかで きれいです。{駅|えき}の {前|まえ}に {小|ちい}さい こうえんが あります。こうえんには {大|おお}きい {木|き}が（1） あります。{毎朝|まいあさ}、わたしは その こうえん（2） さんぽします。
    {駅|えき}の {近|ちか}く（3） おいしい パンやが あります。わたしは {毎週|まいしゅう} {土曜日|どようび}に（4）で パンを {買|か}います。その パンやの パンは {安|やす}（5）、おいしいです。この {町|まち}（6） {来|き}て、（7） {三年|さんねん}に なります。わたしは この {町|まち}が（8） すきです。
  en: "My town is not big, but it is very quiet and pretty. There is a small park in front of the station. The park has lots of big trees. Every morning I take a walk in that park. Near the station there is a good bakery. I buy bread there every Saturday. The bread there is cheap and tasty. It has been three years since I came to this town. I like this town very much."
  blanks:
    - answer: たくさん
      wrong: [とても, ぜんぜん, あまり]
      difficulty: 2
      points: [adverb-takusan]
      note: "たくさん counts: many trees. とても makes a word stronger, so it goes with words like {大|おお}きい or すき, not あります."
    - answer: を
      wrong: [に, へ, が]
      difficulty: 3
      points: [particle-o-through]
      note: "さんぽする takes を for the place you walk through: こうえんを さんぽします. で would also be right, so it is not offered."
    - answer: に
      wrong: [で, を, へ]
      difficulty: 2
      points: [particle-ni-existence]
      note: "に marks where something is: {近|ちか}くに パンやが あります. で marks where something happens."
    - answer: そこ
      wrong: [ここ, あそこ, どこ]
      difficulty: 3
      points: [demonstrative-place]
      note: "そこ points back to a place just named, the bakery. In writing, a place already mentioned takes そ."
    - answer: くて
      wrong: [い, かった, くない]
      difficulty: 2
      points: [form-te-link]
      note: "An い adjective joins the next one with くて: {安|やす}くて、おいしい. Cheap and tasty."
    - answer: に
      wrong: [を, で, が]
      difficulty: 1
      points: [particle-ni-destination]
      note: "{来|く}る takes に for where you arrive: この {町|まち}に {来|き}て."
    - answer: もう
      wrong: [まだ, よく, いつも]
      difficulty: 2
      points: [adverb-mou]
      note: "もう: already. Three years have already passed since the writer came."
    - answer: とても
      wrong: [たくさん, ぜんぜん, あまり]
      difficulty: 2
      points: [adverb-totemo]
      note: "とても makes すき stronger: like it very much. たくさん counts things, and ぜんぜん and あまり need a negative."

