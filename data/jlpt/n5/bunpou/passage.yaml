  intro: "チャンさんは「かいもの」の さくぶんを {書|か}きました。"
  text: |-
    きのう、{母|はは}の たんじょうびの プレゼントを {買|か}い（1） デパートへ {行|い}きました。デパートは {駅|えき}の {前|まえ}（2） あります。
    さんがいで くつを {見|み}ました。いい くつが（3） ありましたが、どれも {高|たか}かったです。それから、ごかい（4） {行|い}きました。ごかいには ハンカチや セーター（5）が ありました。わたしは {青|あお}い セーターを（6）。{七千円|ななせんえん}でした。その セーターは {軽|かる}（7）、あたたかいです。
    {家|いえ}へ {帰|かえ}ってから、{母|はは}に セーターを あげました。{母|はは}は「ありがとう。」（8） {言|い}いました。
  en: "Yesterday I went to a department store to buy a birthday present for my mother. The department store is in front of the station. On the third floor I looked at shoes. There were lots of good shoes, but they were all expensive. After that, I went to the fifth floor. On the fifth floor there were handkerchiefs, sweaters and so on. I bought a blue sweater. It was seven thousand yen. That sweater is light and warm. After I got home, I gave my mother the sweater. My mother said, 'Thank you.'"
  blanks:
    - answer: に
      wrong: [で, を, と]
      difficulty: 2
      points: [form-ni-iku]
      note: "〜に {行|い}く: go to do something. It joins the ます stem: {買|か}いに."
    - answer: に
      wrong: [で, を, へ]
      difficulty: 2
      points: [particle-ni-existence]
      note: "ある takes に for where something is: {駅|えき}の {前|まえ}に あります."
    - answer: たくさん
      wrong: [とても, ぜんぜん, あまり]
      difficulty: 1
      points: [adverb-takusan]
      note: "たくさん counts: many shoes. ぜんぜん and あまり need a negative."
    - answer: へ
      wrong: [を, で, が]
      difficulty: 1
      points: [particle-he-direction]
      note: "へ marks the direction: ごかいへ {行|い}きました. に would also be right, so it is not offered."
    - answer: など
      wrong: [しか, まで, より]
      difficulty: 2
      points: [particle-ya-and]
      note: "Aや Bなど: A, B and so on. など ends a list started with や."
    - answer: "{買|か}いました"
      wrong: ["{買|か}います", "{買|か}いましょう", "{買|か}って ください"]
      difficulty: 1
      points: [form-polite-tense]
      note: "きのう puts it in the past: {買|か}いました."
    - answer: くて
      wrong: [い, かった, くない]
      difficulty: 2
      points: [form-te-link]
      note: "An い adjective joins the next one with くて: {軽|かる}くて、あたたかい. Light and warm."
    - answer: と
      wrong: [に, で, が]
      difficulty: 2
      points: [particle-to-quote]
      note: "と marks the words someone said: 「…」と {言|い}いました."
